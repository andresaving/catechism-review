takers of that one bread." 1 Cor.10:16,17.' }, { "n": 78, "q": "Do then the bread and wine become the very body and blood of Christ?", "a": "Not at all: but as the water in baptism is not changed into the blood of Christ, neither is the washing away of sin itself, being only the sign and confirmation thereof appointed of God; so the bread in the Lord's supper is not changed into the very body of Christ; though agreeably to the nature and properties of sacraments, it is called the body of Christ Jesus." }, { "n": 79, "q": 'Why then doth Christ call the bread "his body", and the cup "his blood", or "the new covenant in his blood"; and Paul the "communion of body and blood of Christ"?', "a": "Christ speaks thus, not without great reason, namely, not only thereby to teach us, that as bread and wine support this temporal life, so his crucified body and shed blood are the true meat and drink, whereby our souls are fed to eternal life; but more especially by these visible signs and pledges to assure us, that we are as really partakers of his true body and blood by the operation of the Holy Ghost as we receive by the mouths of our bodies these holy signs in remembrance of him; and that all his sufferings and obedience are as certainly ours, as if we had in our own persons suffered and made satisfaction for our sins to God." }, { "n": 80, "q": "What difference is there between the Lord's supper and the popish mass?", "a": "The Lord's supper testifies to us, that we have a full pardon of all sin by the only sacrifice of Jesus Christ, which he himself has once accomplished on the cross; and, that we by the Holy Ghost are ingrafted into Christ, who, according to his human nature is now not on earth, but in heaven, at the right hand of God his Father, and will there be worshipped by us. But the mass teaches, that the living and dead have not the pardon of sins through the sufferings of Christ, unless Christ is also daily offered for them by the priests; and further, that Christ is bodily under the form of bread and wine, and therefore is to be worshipped in them; so that the mass, at bottom, is nothing else than a denial of the one sacrifice and sufferings of Jesus Christ, and an accursed idolatry." }, { "n": 81, "q": "For whom is the Lord's supper instituted?", "a": "For those who are truly sorrowful for their sins, and yet trust that these are forgiven them for the sake of Christ; and that their remaining infirmities are covered by his passion and death; and who also earnestly desire to have their faith more and more strengthened, and their lives more holy; but hypocrites, and such as turn not to God with sincere hearts, eat and drink judgment to themselves." }, { "n": 82, "q": "Are they also to be admitted to this supper, who, by confession and life, declare themselves unbelieving and ungodly?", "a": "No; for by this, the covenant of God would be profaned, and his wrath kindled against the whole congregation; therefore it is the duty of the christian church, according to the appointment of Christ and his apostles, to exclude such persons, by the keys of the kingdom of heaven, till they show amendment of life." }, { "n": 83, "q": "What are the keys of the kingdom of heaven?", "a": "The preaching of the holy gospel, and christian discipline, or excommunication out of the christian church; by these two, the kingdom of heaven is opened to believers, and shut against unbelievers." }, { "n": 84, "q": "How is the kingdom of heaven opened and shut by the preaching of the holy gospel?", "a": "Thus: when according to the command of Christ, it is declared and publicly testified to all and every believer, that, whenever they receive the promise of the gospel by a true faith, all their sins are really forgiven them of God, for the sake of Christ's merits; and on the contrary, when it is declared and testified to all unbelievers, and such as do not sincerely repent, that they stand exposed to the wrath of God, and eternal condemnation, so long as they are unconverted: according to which testimony of the gospel, God will judge them, both in this, and in the life to come." }, { "n": 85, "q": "How is the kingdom of heaven shut and opened by christian discipline?", "a": "Thus: when according to the command of Christ, those, who under the name of christians, maintain doctrines, or practices inconsistent therewith, and will not, after having been often brotherly admonished, renounce their errors and wicked course of life, are complained of to the church, or to those, who are thereunto appointed by the church; and if they despise their admonition, are by them forbidden the use of the sacraments; whereby they are excluded from the christian church, and by God himself from the kingdom of Christ; and when they promise and show real amendment, are again received as members of Christ and his church." }, { "n": 86, "q": "Since then we are delivered from our misery, merely of grace, through Christ, without any merit of ours, why must we still do good works?", "a": "Because Christ, having redeemed and delivered us by his blood, also renews us by his Holy Spirit, after his own image; that so we may testify, by the whole of our conduct, our gratitude to God for his blessings, and that he may be praised by us; also, that every one may be assured in himself of his faith, by the fruits thereof; and that, by our godly conversation others may be gained to Christ." }, { "n": 87, "q": "Cannot they then be saved, who, continuing in their wicked and ungrateful lives, are not converted to God?", "a": "By no means; for the holy scripture declares that no unchaste person, idolater, adulterer, thief, covetous man, drunkard, slanderer, robber, or any such like, shall inherit the kingdom of God." }, { "n": 88, "q": "Of how many parts does the true conversion of man consist?", "a": "Of two parts; of the mortification of the old, and the quickening of the new man." }, { "n": 89, "q": "What is the mortification of the old man?", "a": "It is a sincere sorrow of heart, that we have provoked God by our sins; and more and more to hate and flee from them." }, { "n": 90, "q": "What is the quickening of the new man?", "a": "It is a sincere joy of heart in God, through Christ, and with love and delight to live according to the will of God in all good works." }, { "n": 91, "q": "But what are good works?", "a": "Only those which proceed from a true faith, are performed according to the law of God, and to his glory; and not such as are founded on our imaginations, or the institutions of men." }, { "n": 92, "q": "What is the law of God?", "a": "God spake all these words, Exodus 20:1-17 and Deuteronomy 5:6-21, saying: I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage. 1st commandment: Thou shalt have no other gods before me. 2nd commandment: Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth. Thou shalt not bow down thyself to them, nor serve them; for I the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me, and shewing mercy unto thousands of them that love me, and keep my commandments. 3rd commandment: Thou shalt not take the name of the LORD thy God in vain; for the LORD will not hold him guiltless that taketh his name in vain. 4th commandment: Remember the sabbath day, to keep it holy. Six days shalt thou labour, and do all thy work; but the seventh day is the sabbath of the LORD thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates. For in six days the LORD made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the LORD blessed the sabbath day, and hallowed it. 5th commandment: Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee. 6th commandment: Thou shalt not kill. 7th commandment: Thou shalt not commit adultery. 8th commandment: Thou shalt not steal. 9th commandment: Thou shalt not bear false witness against thy neighbour. 10th commandment: Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is thy neighbour's." }, { "n": 93, "q": "How are these commandments divided?", "a": "Into two tables; the first of which teaches us how we must behave towards God; the second, what duties we owe to our neighbour." }, { "n": 94, "q": "What does God enjoin in the first commandment?", "a": "That I, as sincerely as I desire the salvation of my own soul, avoid and flee from all idolatry, sorcery, soothsaying, superstition, invocation of saints, or any other creatures; and learn rightly to know the only true God; trust in him alone, with humility and patience submit to him; expect all good things from him only; love, fear, and glorify him with my whole heart; so that I renounce and forsake all creatures, rather than commit even the least thing contrary to his will." }, { "n": 95, "q": "What is idolatry?", "a": "Idolatry is, instead of, or besides that one true God, who has manifested himself in his word, to contrive, or have any other object, in which men place their trust." }, { "n": 96, "q": "What does God require in the second commandment?", "a": "That we in no wise represent God by images, nor worship him in any other way than he has commanded in his word." }, { "n": 97, "q": "Are images then not at all to be made?", "a": "God neither can, nor may be represented by any means: but as to creatures; though they may be represented, yet God forbids to make, or have any resemblance of them, either in order to worship them or to serve God by them." }, { "n": 98, "q": "But may not images be tolerated in the churches, as books to the laity?", "a": "No: for we must not pretend to be wiser than God, who will have his people taught, not by dumb images, but by the lively preaching of his word." }, { "n": 99, "q": "What is required in the third commandment?", "a": "That we, not only by cursing or perjury, but also by rash swearing, must not profane or abuse the name of God; nor by silence or connivance be partakers of these horrible sins in others; and, briefly, that we use the holy name of God no otherwise than with fear and reverence; so that he may be rightly confessed and worshipped by us, and be glorified in all our words and works." }, { "n": 100, "q": "Is then the profaning of God's name, by swearing and cursing, so heinous a sin, that his wrath is kindled against those who do not endeavour, as much as in them lies, to prevent and forbid such cursing and swearing?", "a": "It undoubtedly is, for there is no sin greater or more provoking to God, than the profaning of his name; and therefore he has commanded this sin to be punished with death." }, { "n": 101, "q": "May we then swear religiously by the name of God?", "a": "Yes: either when the magistrates demand it of the subjects; or when necessity requires us thereby to confirm a fidelity and truth to the glory of God, and the safety of our neighbour: for such an oath is founded on God's word, and therefore was justly used by the saints, both in the Old and New Testament." }, { "n": 102, "q": "May we also swear by saints or any other creatures?", "a": "No; for a lawful oath is calling upon God, as the only one who knows the heart, that he will bear witness to the truth, and punish me if I swear falsely; which honour is due to no creature." }, { "n": 103, "q": "What does God require in the fourth commandment?", "a": "First, that the ministry of the gospel and the schools be maintained; and that I, especially on the sabbath, that is, on the day of rest, diligently frequent the church of God, to hear his word, to use the sacraments, publicly to call upon the Lord, and contribute to the relief of the poor. Secondly, that all the days of my life I cease from my evil works, and yield myself to the Lord, to work by his Holy Spirit in me: and thus begin in this life the eternal sabbath." }, { "n": 104, "q": "What does God require in the fifth commandment?", "a": "That I show all honour, love and fidelity, to my father and mother, and all in authority over me, and submit myself to their good instruction and correction, with due obedience; and also patiently bear with their weaknesses and infirmities, since it pleases God to govern us by their hand." }, { "n": 105, "q": "What does God require in the sixth commandment?", "a": "That neither in thoughts, nor words, nor gestures, much less in deeds, I dishonour, hate, wound, or kill my neighbour, by myself or by another: but that I lay aside all desire of revenge: also, that I hurt not myself, nor wilfully expose myself to any danger. Wherefore also the magistrate is armed with the sword, to prevent murder." }, { "n": 106, "q": "But this commandment seems only to speak of murder?", "a": "In forbidding murder, God teaches us, that he abhors the causes thereof, such as envy, hatred, anger, and desire of revenge; and that he accounts all these as murder." }, { "n": 107, "q": "But is it enough that we do not kill any man in the manner mentioned above?", "a": "No: for when God forbids envy, hatred, and anger, he commands us to love our neighbour as ourselves; to show patience, peace, meekness, mercy, and all kindness, towards him, and prevent his hurt as much as in us lies; and that we do good, even to our enemies." }, { "n": 108, "q": "What does the seventh commandment teach us?", "a": "That all uncleanness is accursed of God: and that therefore we must with all our hearts detest the same, and live chastely and temperately, whether in holy wedlock, or in single life." }, { "n": 109, "q": "Does God forbid in this commandment, only adultery, and such like gross sins?", "a": "Since both our body and soul are temples of the holy Ghost, he commands us to preserve them pure and holy: therefore he forbids all unchaste actions, gestures, words, thoughts, desires, and whatever can entice men thereto." }, { "n": 110, "q": "What does God forbid in the eighth commandment?", "a": "God forbids not only those thefts, and robberies, which are punishable by the magistrate; but he comprehends under the name of theft all wicked tricks and devices, whereby we design to appropriate to ourselves the goods which belong to our neighbour: whether it be by force, or under the appearance of right, as by unjust weights, ells, measures, fraudulent merchandise, false coins, usury, or by any other way forbidden by God; as also all covetousness, all abuse and waste of his gifts." }, { "n": 111, "q": "But what does God require in this commandment?", "a": "That I promote the advantage of my neighbour in every instance I can or may; and deal with him as I desire to be dealt with by others: further also that I faithfully labour, so that I may be able to relieve the needy." }, { "n": 112, "q": "What is required in the ninth commandment?", "a": "That I bear false witness against no man, nor falsify any man's words; that I be no backbiter, nor slanderer; that I do not judge, nor join in condemning any man rashly, or unheard; but that I avoid all sorts of lies and deceit, as the proper works of the devil, unless I would bring down upon me the heavy wrath of God; likewise, that in judgment and all other dealings I love the truth, speak it uprightly and confess it; also that I defend and promote, as much as I am able, the horror and good character of my neighbour." }, { "n": 113, "q": "What does the tenth commandment require of us?", "a": "That even the smallest inclination or thought, contrary to any of God's commandments, never rise in our hearts; but that at all times we hate all sin with our whole heart, and delight in all righteousness." }, { "n": 114, "q": "But can those who are converted to God perfectly keep these commandments?", "a": "No: but even the holiest men, while in this life, have only a small beginning of this obedience; yet so, that with a sincere resolution they begin to live, not only according to some, but all the commandments of God." }, { "n": 115, "q": "Why will God then have the ten commandments so strictly preached, since no man in this life can keep them?", "a": "First, that all our lifetime we may learn more and more to know our sinful nature, and thus become the more earnest in seeking the remission of sin, and righteousness in Christ; likewise, that we constantly endeavour and pray to God for the grace of the Holy Spirit, that we may become more and more conformable to the image of God, till we arrive at the perfection proposed to us, in a life to come." }, { "n": 116, "q": "Why is prayer necessary for christians?", "a": "Because it is the chief part of thankfulness which God requires of us: and also, because God will give his grace and Holy Spirit to those only, who with sincere desires continually ask them of him, and are thankful for them." }, { "n": 117, "q": "What are the requisites of that prayer, which is acceptable to God, and which he will hear?", "a": "First, that we from the heart pray to the one true God only, who has manifested himself in his word, for all things, he has commanded us to ask of him; secondly, that we rightly and thoroughly know our need and misery, that so we may deeply humble ourselves in the presence of his divine majesty; thirdly, that we be fully persuaded that he, notwithstanding that we are unworthy of it, will, for the sake of Christ our Lord, certainly hear our prayer, as he has promised us in his word." }, { "n": 118, "q": "What has God commanded us to ask of him?", "a": "All things necessary for soul and body; which Christ our Lord has comprised in that prayer he himself has taught us." }, { "n": 119, "q": "What are the words of that prayer?", "a": "Our Father which art in heaven, 1 Hallowed be thy name. 2 Thy kingdom come. 3 Thy will be done on earth, as it is in heaven. 4 Give us this day our daily bread. 5 And forgive us our debts, as we forgive our debtors. 6 And lead us not into temptation, but deliver us from evil. For thine is the kingdom, and the power, and the glory, for ever. Amen." }, { "n": 120, "q": 'Why has Christ commanded us to address God thus: "Our Father"?', "a": "That immediately, in the very beginning of our prayer, he might excite in us a childlike reverence for, and confidence in God, which are the foundation of our prayer: namely, that God is become our Father in Christ, and will much less deny us what we ask of him in true faith, than our parents will refuse us earthly things." }, { "n": 121, "q": 'Why is it here added, "Which art in heaven"?', "a": "Lest we should form any earthly conceptions of God's heavenly majesty, and that we may expect from his almighty power all things necessary for soul and body." }, { "n": 122, "q": "Which is the first petition?", "a": '"Hallowed be thy name"; that is, grant us, first, rightly to know thee, and to sanctify, glorify and praise thee, in all thy works, in which thy power, wisdom, goodness, justice, mercy and truth, are clearly displayed; and further also, that we may so order and direct our whole lives, our thoughts, words and actions, that thy name may never be blasphemed, but rather honoured and praised on our account.' }, { "n": 123, "q": "Which is the second petition?", "a": '"Thy kingdom come"; that is, rule us so by thy word and Spirit, that we may submit ourselves more and more to thee; preserve and increase thy church; destroy the works of the devil, and all violence which would exalt itself against thee; and also all wicked counsels devised against thy holy word; till the full perfection of thy kingdom take place, wherein thou shalt be all in all.' }, { "n": 124, "q": "Which is the third petition?", "a": '"Thy will be done on earth as it is in heaven"; that is, grant that we and all men may renounce our own will, and without murmuring obey thy will, which is only good; that every one may attend to, and perform the duties of his station and calling, as willingly and faithfully as the angels do in heaven.' }, { "n": 125, "q": "Which is the fourth petition?", "a": '"Give us this day our daily bread"; that is, be pleased to provide us with all things necessary for the body, that we may thereby acknowledge thee to be the only fountain of all good, and that neither our care nor industry, nor even thy gifts, can profit us without thy blessing; and therefore that we may withdraw our trust from all creatures, and place it alone in thee.' }, { "n": 126, "q": "Which is the fifth petition?", "a": '"And forgive us our debts as we forgive our debtors"; that is, be pleased for the sake of Christ\'s blood, not to impute to us poor sinners, our transgressions, nor that depravity, which always cleaves to us; even as we feel this evidence of thy grace in us, that it is our firm resolution from the heart to forgive our neighbour.' }, { "n": 127, "q": "Which is the sixth petition?", "a": '"And lead us not into temptation, but deliver us from evil"; that is, since we are so weak in ourselves, that we cannot stand a moment; and besides this, since our mortal enemies, the devil, the world, and our own flesh, cease not to assault us, do thou therefore preserve and strengthen us by the power of thy Holy Spirit, that we may not be overcome in this spiritual warfare, but constantly and strenuously may resist our foes, till at last we obtain a complete victory.' }, { "n": 128, "q": "How dost thou conclude thy prayer?", "a": '"For thine is the kingdom, and the power, and the glory, forever"; that is, all these we ask of thee, because thou, being our King and almighty, art willing and able to give us all good; and all this we pray for, that thereby not we, but thy holy name, may be glorified for ever.' }, { "n": 129, "q": 'What does the word "Amen" signify?', "a": '"Amen" signifies, it shall truly and certainly be: for my prayer is more assuredly heard of God, than I feel in my heart that I desire these things of him.' }] }, "luth": { "name": "Luther's Small Catechism", "short": "Luther's Small", "blurb": "Lutheran, 1529. Commandments, Creed, Prayer, sacraments.", "chapters": [{ "label": "Ten Commandments", "from": 1, "to": 22 }, { "label": "Creed", "from": 23, "to": 28 }, { "label": "Lord's Prayer", "from": 29, "to": 50 }, { "label": "Baptism", "from": 51, "to": 57 }, { "label": "Confession", "from": 58, "to": 62 }, { "label": "Sacrament of the Altar", "from": 63, "to": 67 }], "items": [{ "n": 1, "q": "The First Commandment", "a": "Thou shalt have no other gods." }, { "n": 2, "q": "The First Commandment: What does this mean?", "a": "We should fear, love, and trust in God above all things." }, { "n": 3, "q": "The Second Commandment", "a": "Thou shalt not take the name of the Lord, thy God, in vain." }, { "n": 4, "q": "The Second Commandment: What does this mean?", "a": "We should fear and love God that we may not curse, swear, use witchcraft, lie, or deceive by His name, but call upon it in every trouble, pray, praise, and give thanks." }, { "n": 5, "q": "The Third Commandment", "a": "Thou shalt sanctify the holy-day." }, { "n": 6, "q": "The Third Commandment: What does this mean?", "a": "We should fear and love God that we may not despise preaching and His Word, but hold it sacred, and gladly hear and learn it." }, { "n": 7, "q": "The Fourth Commandment", "a": "Thou shalt honor thy father and thy mother, that it may be well with thee and thou mayest live long upon the earth." }, { "n": 8, "q": "The Fourth Commandment: What does this mean?", "a": "We should fear and love God that we may not despise nor anger our parents and masters, but give them honor, serve, obey, and hold them in love and esteem." }, { "n": 9, "q": "The Fifth Commandment", "a": "Thou shalt not kill." }, { "n": 10, "q": "The Fifth Commandment: What does this mean?", "a": "We should fear and love God that we may not hurt nor harm our neighbor in his body, but help and befriend him in every bodily need." }, { "n": 11, "q": "The Sixth Commandment", "a": "Thou shalt not commit adultery." }, { "n": 12, "q": "The Sixth Commandment: What does this mean?", "a": "We should fear and love God that we may lead a chaste and decent life in words and deeds, and each love and honor his spouse." }, { "n": 13, "q": "The Seventh Commandment", "a": "Thou shalt not steal." }, { "n": 14, "q": "The Seventh Commandment: What does this mean?", "a": "We should fear and love God that we may not take our neighbor's money or property, nor get them by false ware or dealing, but help him to improve and protect his property and business." }, { "n": 15, "q": "The Eighth Commandment", "a": "Thou shalt not bear false witness against thy neighbor." }, { "n": 16, "q": "The Eighth Commandment: What does this mean?", "a": "We should fear and love God that we may not deceitfully belie, betray, slander, or defame our neighbor, but defend him, speak well of him, and put the best construction on everything." }, { "n": 17, "q": "The Ninth Commandment", "a": "Thou shalt not covet thy neighbor's house." }, { "n": 18, "q": "The Ninth Commandment: What does this mean?", "a": "We should fear and love God that we may not craftily seek to get our neighbor's inheritance or house, and obtain it by a show of right, etc., but help and be of service to him in keeping it." }, { "n": 19, "q": "The Tenth Commandment", "a": "Thou shalt not covet thy neighbor's wife, nor his man-servant, nor his maid-servant, nor his cattle, nor anything that is his." }, { "n": 20, "q": "The Tenth Commandment: What does this mean?", "a": "We should fear and love God that we may not estrange, force, or entice away our neighbor's wife, servants, or cattle, but urge them to stay and do their duty." }, { "n": 21, "q": "What does God say of all these commandments?", "a": "He says thus: I the Lord, thy God, am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate Me, and showing mercy unto thousands of them that love Me and keep My commandments." }, { "n": 22, "q": "Ten Commandments: What does this mean?", "a": "God threatens to punish all that transgress these commandments. Therefore we should dread His wrath and not act contrary to these commandments. But He promises grace and every blessing to all that keep these commandments. Therefore we should also love and trust in Him, and gladly do according to His commandments." }, { "n": 23, "q": "The First Article: Of Creation", "a": "I believe in God the Father Almighty, Maker of heaven and earth." }, { "n": 24, "q": "The First Article: Of Creation: What does this mean?", "a": "I believe that God has made me and all creatures; that He has given me my body and soul, eyes, ears, and all my limbs, my reason, and all my senses, and still preserves them; in addition thereto, clothing and shoes, meat and drink, house and homestead, wife and children, fields, cattle, and all my goods; that He provides me richly and daily with all that I need to support this body and life, protects me from all danger, and guards me and preserves me from all evil; and all this out of pure, fatherly, divine goodness and mercy, without any merit or worthiness in me; for all which I owe it to Him to thank, praise, serve, and obey Him. This is most certainly true." }, { "n": 25, "q": "The Second Article: Of Redemption", "a": "And in Jesus Christ, His only Son, our Lord; who was conceived by the Holy Ghost, born of the Virgin Mary; suffered under Pontius Pilate, was crucified, dead, and buried; He descended into hell; the third day He rose again from the dead; He ascended into heaven, and sitteth on the right hand of God the Father Almighty; from thence He shall come to judge the quick and the dead." }, { "n": 26, "q": "The Second Article: Of Redemption: What does this mean?", "a": "I believe that Jesus Christ, true God, begotten of the Father from eternity, and also true man, born of the Virgin Mary, is my Lord, who has redeemed me, a lost and condemned creature, purchased and won me from all sins, from death, and from the power of the devil, not with gold or silver, but with His holy, precious blood and with His innocent suffering and death, in order that I may be His own, and live under Him in His kingdom, and serve Him in everlasting righteousness, innocence, and blessedness, even as He is risen from the dead, lives and reigns to all eternity. This is most certainly true." }, { "n": 27, "q": "The Third Article: Of Sanctification", "a": "I believe in the Holy Ghost; one holy Christian Church, the communion of saints; the forgiveness of sins; the resurrection of the body; and the life everlasting. Amen." }, { "n": 28, "q": "The Third Article: Of Sanctification: What does this mean?", "a": "I believe that I cannot by my own reason or strength believe in Jesus Christ, my Lord, or come to Him; but the Holy Ghost has called me by the Gospel, enlightened me with His gifts, sanctified and kept me in the true faith; even as He calls, gathers, enlightens, and sanctifies the whole Christian Church on earth, and keeps it with Jesus Christ in the one true faith; in which Christian Church He forgives daily and richly all sins to me and all believers, and at the last day will raise up me and all the dead, and will give to me and to all believers in Christ everlasting life. This is most certainly true." }, { "n": 29, "q": "Introduction", "a": "Our Father who art in heaven." }, { "n": 30, "q": "Introduction: What does this mean?", "a": "God would thereby tenderly urge us to believe that He is our true Father, and that we are His true children, so that we may ask Him confidently with all assurance, as dear children ask their dear father." }, { "n": 31, "q": "The First Petition", "a": "Hallowed be Thy name." }, { "n": 32, "q": "The First Petition: What does this mean?", "a": "God's name is indeed holy in itself; but we pray in this petition that it may become holy among us also." }, { "n": 33, "q": "The First Petition: How is this done?", "a": "When the Word of God is taught in its truth and purity, and we as the children of God also lead holy lives in accordance with it. To this end help us, dear Father in heaven. But he that teaches and lives otherwise than God's Word teaches profanes the name of God among us. From this preserve us, Heavenly Father." }, { "n": 34, "q": "The Second Petition", "a": "Thy kingdom come." }, { "n": 35, "q": "The Second Petition: What does this mean?", "a": "The kingdom of God comes indeed without our prayer, of itself; but we pray in this petition that it may come unto us also." }, { "n": 36, "q": "The Second Petition: How is this done?", "a": "When our heavenly Father gives us His Holy Spirit, so that by His grace we believe His holy Word and lead a godly life here in time and yonder in eternity." }, { "n": 37, "q": "The Third Petition", "a": "Thy will be done on earth as it is in heaven." }, { "n": 38, "q": "The Third Petition: What does this mean?", "a": "The good and gracious will of God is done indeed without our prayer; but we pray in this petition that it may be done among us also." }, { "n": 39, "q": "The Third Petition: How is this done?", "a": "When God breaks and hinders every evil counsel and will which would not let us hallow the name of God nor let His kingdom come, such as the will of the devil, the world, and our flesh; but strengthens and keeps us steadfast in His Word and in faith unto our end. This is His gracious and good will." }, { "n": 40, "q": "The Fourth Petition", "a": "Give us this day our daily bread." }, { "n": 41, "q": "The Fourth Petition: What does this mean?", "a": "God gives daily bread, even without our prayer, to all wicked men; but we pray in this petition that He would lead us to know it, and to receive our daily bread with thanksgiving." }, { "n": 42, "q": "What is meant by daily bread?", "a": "Everything that belongs to the support and wants of the body, such as meat, drink, clothing, shoes, house, homestead, field, cattle, money, goods, a pious spouse, pious children, pious servants, pious and faithful magistrates, good government, good weather, peace, health, discipline, honor, good friends, faithful neighbors, and the like." }, { "n": 43, "q": "The Fifth Petition", "a": "And forgive us our trespasses, as we forgive those who trespass against us." }, { "n": 44, "q": "The Fifth Petition: What does this mean?", "a": "We pray in this petition that our Father in heaven would not look upon our sins, nor deny such petitions on account of them; for we are worthy of none of the things for which we pray, neither have we deserved them; but that He would grant them all to us by grace; for we daily sin much, and indeed deserve nothing but punishment. So will we verily, on our part, also heartily forgive and also readily do good to those who sin against us." }, { "n": 45, "q": "The Sixth Petition", "a": "And lead us not into temptation." }, { "n": 46, "q": "The Sixth Petition: What does this mean?", "a": "God, indeed, tempts no one; but we pray in this petition that God would guard and keep us, so that the devil, the world, and our flesh may not deceive us, nor seduce us into misbelief, despair, and other great shame and vice; and though we be assailed by them, that still we may finally overcome and gain the victory." }, { "n": 47, "q": "The Seventh Petition", "a": "But deliver us from evil." }, { "n": 48, "q": "The Seventh Petition: What does this mean?", "a": "We pray in this petition, as in a summary, that our Father in heaven would deliver us from all manner of evil, of body and soul, property and honor, and at last, when our last hour shall come, grant us a blessed end, and graciously take us from this vale of tears to Himself into heaven." }, { "n": 49, "q": "Conclusion", "a": "Amen." }, { "n": 50, "q": "Conclusion: What does this mean?", "a": "That I should be certain that these petitions are acceptable to our Father in heaven and heard; for He Himself has commanded us so to pray, and has promised that He will hear us. Amen, Amen; that is, Yea, yea, it shall be so." }, { "n": 51, "q": "What is Baptism?", "a": "Baptism is not simple water only, but it is the water comprehended in God's command and connected with God's Word." }, { "n": 52, "q": "Which is that word of God?", "a": "Christ, our Lord, says in the last chapter of Matthew: Go ye into all the world and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost." }, { "n": 53, "q": "What does Baptism give or profit?", "a": "It works forgiveness of sins, delivers from death and the devil, and gives eternal salvation to all who believe this, as the words and promises of God declare." }, { "n": 54, "q": "Which are such words and promises of God?", "a": "Christ, our Lord, says in the last chapter of Mark: He that believeth and is baptized shall be saved; but he that believeth not shall be damned." }, { "n": 55, "q": "How can water do such great things?", "a": "It is not the water indeed that does them, but the word of God which is in and with the water, and faith, which trusts such word of God in the water. For without the word of God the water is simple water and no baptism. But with the word of God it is a baptism, that is, a gracious water of life and a washing of regeneration in the Holy Ghost, as St. Paul says, Titus, chapter three: By the washing of regeneration and renewing of the Holy Ghost, which He shed on us abundantly through Jesus Christ, our Savior, that, being justified by His grace, we should be made heirs according to the hope of eternal life. This is a faithful saying." }, { "n": 56, "q": "What does such baptizing with water signify?", "a": "It signifies that the old Adam in us should, by daily contrition and repentance, be drowned and die with all sins and evil lusts, and, again, a new man daily come forth and arise; who shall live before God in righteousness and purity forever." }, { "n": 57, "q": "Baptism: Where is this written?", "a": "St. Paul says Romans, chapter 6: We are buried with Christ by Baptism into death, that, like as He was raised up from the dead by the glory of the Father, even so we also should walk in newness of life." }, { "n": 58, "q": "What is Confession?", "a": "Confession embraces two parts: the one is, that we confess our sins; the other, that we receive absolution, or forgiveness, from the confessor, as from God Himself, and in no wise doubt, but firmly believe, that our sins are thereby forgiven before God in heaven." }, { "n": 59, "q": "What sins should we confess?", "a": "Before God we should plead guilty of all sins, even of those which we do not know, as we do in the Lord's Prayer. But before the confessor we should confess those sins alone which we know and feel in our hearts." }, { "n": 60, "q": "Which are these?", "a": "Here consider your station according to the Ten Commandments, whether you are a father, mother, son, daughter, master, mistress, a man-servant or maid-servant; whether you have been disobedient, unfaithful, slothful; whether you have grieved any one by words or deeds; whether you have stolen, neglected, or wasted aught, or done other injury." }, { "n": 61, "q": "Pray, propose to me a brief form of confession.", "a": "You should speak to the confessor thus: Reverend and dear sir, I beseech you to hear my confession, and to pronounce forgiveness to me for God's sake." }, { "n": 62, "q": "Dost thou believe that my forgiveness is God's forgiveness?", "a": "Yes, dear sir." }, { "n": 63, "q": "What is the Sacrament of the Altar?", "a": "It is the true body and blood of our Lord Jesus Christ, under the bread and wine, for us Christians to eat and to drink, instituted by Christ Himself." }, { "n": 64, "q": "Sacrament of the Altar: Where is this written?", "a": "The holy Evangelists, Matthew, Mark, Luke, and St. Paul, write thus: Our Lord Jesus Christ, the same night in which He was betrayed, took bread: and when He had given thanks, He brake it, and gave it to His disciples, and said, Take, eat; this is My body, which is given for you. This do in remembrance of Me. After the same manner also He took the cup, when He had supped, gave thanks, and gave it to them, saying, Take, drink ye all of it. This cup is the new testament in My blood, which is shed for you for the remission of sins. This do ye, as oft as ye drink it, in remembrance of Me." }, { "n": 65, "q": "What is the benefit of such eating and drinking?", "a": "That is shown us in these words: Given, and shed for you, for the remission of sins; namely, that in the Sacrament forgiveness of sins, life, and salvation are given us through these words. For where there is forgiveness of sins, there is also life and salvation." }, { "n": 66, "q": "How can bodily eating and drinking do such great things?", "a": "It is not the eating and drinking, indeed, that does them, but the words which stand here, namely: Given, and shed for you, for the remission of sins. Which words are, beside the bodily eating and drinking, as the chief thing in the Sacrament; and he that believes these words has what they say and express, namely, the forgiveness of sins." }, { "n": 67, "q": "Who, then, receives such Sacrament worthily?", "a": "Fasting and bodily preparation is, indeed, a fine outward training; but he is truly worthy and well prepared who has faith in these words: Given, and shed for you, for the remission of sins. But he that does not believe these words, or doubts, is unworthy and unfit; for the words For you require altogether believing hearts." }] }, "keach": { "name": "Keach's Baptist Catechism", "short": "Keach's Baptist", "blurb": "Particular Baptist, 1693.", "chapters": [{ "label": "God & His Word", "from": 1, "to": 12 }, { "label": "Creation & the Fall", "from": 13, "to": 23 }, { "label": "Christ our Redeemer", "from": 24, "to": 33 }, { "label": "Salvation", "from": 34, "to": 45 }, { "label": "God's law", "from": 46, "to": 51 }, { "label": "Commandments 1–4", "from": 52, "to": 69 }, { "label": "Commandments 5–10", "from": 70, "to": 87 }, { "label": "Faith & repentance", "from": 88, "to": 95 }, { "label": "Word & sacraments", "from": 96, "to": 109 }, { "label": "The Lord's Prayer", "from": 110, "to": 118 }], "items": [{ "n": 1, "q": "Who is the first and best of beings?", "a": "God is the first and best of beings." }, { "n": 2, "q": "What is the chief end of man?", "a": "Man's chief end is to glorify God and to enjoy Him forever." }, { "n": 3, "q": "How do we know there is a God?", "a": "The light of nature in man, and the works of God, plainly declare that there is a God; but His Word and Spirit only, do effectually reveal Him unto us for our salvation." }, { "n": 4, "q": "What is the Word of God?", "a": "The Scriptures of the Old and New Testaments, being given by divine inspiration, are the Word of God, the only infallible rule of faith and practice." }, { "n": 5, "q": "How do we know that the Bible is the Word of God?", "a": "The Bible evidences itself to be God's Word by the heavenliness of its doctrine, the unity of its parts, its power to convert sinners and to edify saints; but the Spirit of God only, bearing witness by and with the Scriptures in our hearts, is able fully to persuade us that the Bible is the Word of God." }, { "n": 6, "q": "May all men make use of the Scriptures?", "a": "All men are not only permitted, but commanded and exhorted, to read, hear, and understand the Scriptures." }, { "n": 7, "q": "What do the Scriptures principally teach?", "a": "The Scriptures principally teach what man is to believe concerning God and what duty God requires of man." }, { "n": 8, "q": "What is God?", "a": "God is a Spirit, infinite, eternal, and unchangeable in His being, wisdom, power, holiness, justice, goodness and truth." }, { "n": 9, "q": "Are there more gods than one?", "a": "There is but one only, the living and true God." }, { "n": 10, "q": "How many persons are there in the Godhead?", "a": "There are three persons in the Godhead, the Father, the Son, and the Holy Spirit; and these three are one God, the same in essence, equal in power and glory." }, { "n": 11, "q": "What are the decrees of God?", "a": "The decrees of God are His eternal purpose, according to the counsel of His will, whereby for His own glory, He has fore-ordained whatsoever comes to pass" }, { "n": 12, "q": "How does God execute His decrees?", "a": "God executes His decrees in the works of creation and providence." }, { "n": 13, "q": "What is the work of creation?", "a": "The work of creation is God's making all things of nothing, by the Word of His power, in the space of six days, and all very good." }, { "n": 14, "q": "How did God create man?", "a": "God created man male and female, after His own image, in knowledge, righteousness, and holiness, with dominion over the creatures." }, { "n": 15, "q": "What are God's works of providence?", "a": "God's works of providence are His most holy, wise, and powerful preserving and governing all His creatures, and all their actions." }, { "n": 16, "q": "What special act of providence did God exercise towards man, in the estate wherein he was created?", "a": "When God had created man, He entered into a covenant of works with him, upon condition of perfect obedience, forbidding him to eat of the tree of the knowledge of good and evil, upon pain of death." }, { "n": 17, "q": "Did our first parents continue in the estate wherein they were created?", "a": "Our first parents, being left to the freedom of their own will, fell from the estate wherein they were created, by sinning against God." }, { "n": 18, "q": "What is sin?", "a": "Sin is any want of conformity unto, or transgression of, the law of God." }, { "n": 19, "q": "What was the sin whereby our first parents fell from the estate wherein they were created?", "a": "The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit." }, { "n": 20, "q": "Did all mankind fall in Adam's first transgression?", "a": "The covenant being made with Adam, not only for himself but for his posterity, all mankind, descending from him by ordinary generation, sinned in him, and fell with him in his first transgression." }, { "n": 21, "q": "Into what estate did the fall bring mankind?", "a": "The fall brought mankind into an estate of sin and misery." }, { "n": 22, "q": "Wherein consists the sinfulness of that estate whereunto man fell?", "a": "The sinfulness of that estate whereunto man fell, consists in the guilt of Adam's first sin, the want of original righteousness, and the corruption of his whole nature, which is commonly called original sin, together with all actual transgressions which proceed from it." }, { "n": 23, "q": "What is the misery of that estate whereunto man fell?", "a": "All mankind, by their fall lost communion with God, are under His wrath and curse, and 80 made liable to all the miseries of this life, to death itself, and to the pains of hell forever." }, { "n": 24, "q": "Did God leave all mankind to perish in the estate of sin and misery?", "a": "God, out of His mere good pleasure, from all eternity, having chosen a people to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation, by a Redeemer." }, { "n": 25, "q": "Who is the Redeemer of God's elect?", "a": "The only Redeemer of God's elect is the Lord Jesus Christ, who, being the eternal Son of God, became man, and so was and continues to be God and man, in two distinct natures and one person, forever." }, { "n": 26, "q": "How did Christ, being the Son of God, become man?", "a": "Christ, the Son of God became man by taking to himself a true body and a reasonable soul; being conceived by the power of the Holy Spirit in the womb of the Virgin Mary and born of her, yet without sin." }, { "n": 27, "q": "What offices does Christ execute as our Redeemer?", "a": "Christ, as our Redeemer, executes the offices of a prophet, of a priest, and of a king, both in His estate of humiliation and exaltation." }, { "n": 28, "q": "How does Christ execute the office of a prophet?", "a": "Christ executes the office of a prophet, in revealing to us, by this Word and Spirit, the will of God for our salvation." }, { "n": 29, "q": "How does Christ execute the office of a priest?", "a": "Christ executes the office of a priest, in His once offering up of Himself, a sacrifice to satisfy divine justice, and reconcile us to God, and in making continual intercession for us." }, { "n": 30, "q": "How does Christ execute the office of a king?", "a": "Christ executes the office of a king, in subduing us to Himself, in ruling and defending us, and in restraining and conquering all His and our enemies." }, { "n": 31, "q": "Wherein did Christ's humiliation consist?", "a": "Christ's humiliation consisted in His being born, and that in a low condition, made under the law, undergoing the miseries of this life, the wrath of God, and the cursed death of the cross, in being buried, and continuing under the power of death for a time." }, { "n": 32, "q": "Wherein consists Christ's exaltation?", "a": "Christ's exaltation consists in His rising again from the dead on the third day, in ascending up into heaven, in sitting at the right hand of God the Father, and in coming to judge the world at the last day." }, { "n": 33, "q": "How are we made partakers of the redemption purchased by Christ?", "a": "We are made partakers of the redemption purchased by Christ, by the effectual application of it to us, by His Holy Spirit." }, { "n": 34, "q": "How does the Spirit apply to us the redemption purchased by Christ?", "a": "The Spirit applies to us the redemption purchased by Christ, by working faith in us, and thereby uniting us to Christ in our effectual calling." }, { "n": 35, "q": "What is effectual calling?", "a": "Effectual calling is the work of God's Spirit, whereby, convincing us of our sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ, freely offered to us in the Gospel." }, { "n": 36, "q": "What benefits do they that are effectually called, partake of in this life?", "a": "They that are effectually called, do in this life partake of justification, adoption, sanctification, and the several benefits which in this life do either accompany or flow from them." }, { "n": 37, "q": "What is justification?", "a": "Justification is an act of God's free grace, wherein He pardons all our sins, and accepts us as righteous in His sight, only for the righteousness of Christ imputed to us, and received by faith alone." }, { "n": 38, "q": "What is adoption?", "a": "Adoption is an act of God's free grace, whereby we are received into the number, and have a right to all the privileges of the sons of God." }, { "n": 39, "q": "What is sanctification?", "a": "Sanctification is a work of God's free grace whereby we are renewed in the whole man after the image of God, and are enabled more and more to die unto sin, and live unto righteousness." }, { "n": 40, "q": "What are the benefits which in this life do accompany or flow from justification, adoption, and sanctification?", "a": "The benefits which in this life do accompany or flow from justification, adoption, and sanctification, are, assurance of God's love, peace of conscience, joy in the Holy Spirit, increase of grace, and perseverance therein to the end." }, { "n": 41, "q": "What benefits do believers receive from Christ at death?", "a": "The souls of believers are at death made perfect in holiness, and do immediately pass into glory, and their bodies, being still united to Christ, do rest in their graves till the resurrection." }, { "n": 42, "q": "What benefits do believers receive from Christ at the Resurrection?", "a": "At the resurrection, believers become raised up in glory, shall be openly acknowledged and acquitted in the day of judgment, and made perfectly blessed in the full enjoyment of God to all eternity." }, { "n": 43, "q": "What shall be done to the wicked at death?", "a": "The souls of the wicked shall at death, be cast into the torments of hell, and their bodies lie in their graves till the resurrection and judgement of the great day." }, { "n": 44, "q": "What shall be done to the wicked at the day of judgement?", "a": "At the day of judgement, the bodies of the wicked, being raised out of their graves, shall be sentenced, together with their souls, to unspeakable torments with the devil and his angels forever." }, { "n": 45, "q": "What is the duty which God requires of man?", "a": "The duty which God requires of man, is obedience to His revealed will." }, { "n": 46, "q": "What did God at first reveal to man for the rule of his obedience?", "a": "The rule which God at first revealed to man for his obedience was the moral law." }, { "n": 47, "q": "Where is the moral law summarily comprehended?", "a": "The moral law is summarily comprehended in the Ten Commandments." }, { "n": 48, "q": "What is the sum of the Ten Commandments?", "a": "The sum of the Ten Commandments is, to love the Lord our God, with all our heart, with all our soul, with all our strength, and with all our mind; and our neighbor as ourselves." }, { "n": 49, "q": "What is the preface to the Ten Commandments?", "a": 'The preface to the Ten Commandments is, "I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage."' }, { "n": 50, "q": "What does the preface to the Ten Commandments teach us?", "a": "The preface to the Ten Commandments teaches us, that because God is the Lord, and our God and Redeemer, therefore we are bound to keep all His commandments." }, { "n": 51, "q": "Which is the first commandment?", "a": 'The first commandment is, "Thou shalt have no other Gods before me."' }, { "n": 52, "q": "What is required in the first commandment?", "a": "The first commandment requires us to know and acknowledge God to be the only true God, and our God, and to worship and glorify Him accordingly." }, { "n": 53, "q": "What is forbidden in the first commandment?", "a": "The first commandment forbids the denying, or not worshipping and glorifying the true God, as God and our God; and the giving that worship and glory to any other, which is due unto Him alone." }, { "n": 54, "q": 'What are we especially taught by these words, "before me," in the first commandment?', "a": 'These words, "before me", in the first commandment, teach us, that God, who sees all things, takes notice of, and is much displeased with the sin of having any other God.' }, { "n": 55, "q": "Which is the second commandment?", "a": 'The second commandment is, "Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth. Thou shalt not bow down thyself to them, nor serve them; for I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me: and showing mercy unto thousands of them that love me and keep my commandments."' }, { "n": 56, "q": "What is required in the second commandment?", "a": "The second commandment requires the receiving, observing, and keeping pure and entire, all such religious worship and ordinances, as God has appointed in His Word." }, { "n": 57, "q": "What is forbidden in the second commandment?", "a": "The second commandment forbids the worshipping of God by images, or any other way not appointed in His Word." }, { "n": 58, "q": "What are the reasons annexed to the second commandment?", "a": "The reasons annexed to the second commandment, are, God's sovereignty over us, His propriety in us, and the zeal He has for His own worship." }, { "n": 59, "q": "Which is the third commandment?", "a": 'The third commandment is, "Thou shalt not take the name of the Lord thy God in vain: for the Lord will not hold him guiltless that taketh his name in vain."' }, { "n": 60, "q": "What is required in the third commandment?", "a": "The third commandment requires the holy and reverent use of God's names, titles, attributes, ordinances, words, and works." }, { "n": 61, "q": "What is forbidden in the third commandment?", "a": "The third commandment forbids all profaning and abusing of any thing whereby God makes Himself known." }, { "n": 62, "q": "What is the reason annexed to the third commandment?", "a": "The reason annexed to the third commandment is, that howsoever the breakers of this commandment may escape punishment from men, yet the Lord our God will not suffer them to escape His righteous judgment." }, { "n": 63, "q": "Which is the fourth commandment?", "a": 'The fourth commandment is, "Remember the Sabbath day to keep it holy. Six days shalt thou labor and do all thy work; but the seventh day is the Sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maid servant, nor thy cattle, nor thy stranger that is within thy gates: for in six days the Lord made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the Lord blessed the Sabbath day and hallowed it."' }, { "n": 64, "q": "What is required in the fourth commandment?", "a": "The fourth commandment requires the keeping holy to God such set times as He has appointed in His Word, expressly one whole day in seven to be a holy Sabbath to Himself." }, { "n": 65, "q": "Which day of the seven has God appointed to be the weekly Sabbath?", "a": "From the creation of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly Sabbath; and the first day of the week ever since, to continue to the end of the world, which is the Christian Sabbath." }, { "n": 66, "q": "How is the Sabbath to be sanctified?", "a": "The Sabbath is to sanctified by a holy resting all that day, even from such worldly employments and recreations as are lawful on other days, and spending the time in the public and private exercises of God's worship, except so much as is to be taken up in the works of necessity and mercy." }, { "n": 67, "q": "What is forbidden in the fourth commandment?", "a": "The fourth commandment forbids the omission or careless performance of the duties required, and the profaning the day by idleness, or doing that which is in itself sinful, or by unnecessary thoughts, words, or works, about worldly employments or recreations." }, { "n": 68, "q": "What are the reasons annexed to the fourth commandment?", "a": "The reasons annexed to the fourth commandment are, God's allowing us six days of the week for our own employments, His challenging a special propriety in the seventh, His own example and His blessing the Sabbath day." }, { "n": 69, "q": "Which is the fifth commandment?", "a": 'The fifth commandment is, "Honor thy father and thy mother, that thy days may be long upon the land which the Lord thy God giveth thee."' }, { "n": 70, "q": "What is required in the fifth commandment?", "a": "The fifth commandment requires the preserving the honor, and performing the duties, belonging to every one in their several places and relations, as superiors, inferiors, or equals." }, { "n": 71, "q": "What is forbidden in the fifth commandment?", "a": "The fifth commandment forbids the neglecting of, or doing anything against the honor and duty which belongs to every one in their several places and relations." }, { "n": 72, "q": "What is the reason annexed to the fifth commandment?", "a": "The reason annexed to the fifth commandment is a promise of long life and prosperity (as far as it shall serve God's glory and their own good), to all such as keep this commandment." }, { "n": 73, "q": "Which is the sixth commandment?", "a": 'The sixth commandment is, "Thou shalt not kill."' }, { "n": 74, "q": "What is required in the sixth commandment?", "a": "The sixth commandment requires all lawful endeavors to preserve our own life and the life of others." }, { "n": 75, "q": "What is forbidden in the sixth commandment?", "a": "The sixth commandment forbids the taking away our own life, or the life of our neighbor unjustly, or whatsoever tends thereto." }, { "n": 76, "q": "Which is the seventh commandment?", "a": 'The seventh commandment is, "Thou shalt not commit adultery."' }, { "n": 77, "q": "What is required in the seventh commandment?", "a": "The seventh commandment requires the preservation of our own and our neighbor's chastity, in heart, speech, and behavior." }, { "n": 78, "q": "What is forbidden in the seventh commandment?", "a": "The seventh commandment forbids all unchaste thoughts, words, and actions." }, { "n": 79, "q": "Which is the eighth commandment?", "a": 'The eighth commandment is, "Thou shalt not steal."' }, { "n": 80, "q": "What is required in the eighth commandment?", "a": "The eighth commandment requires the lawful procuring and furthering the wealth and outward state of ourselves and others." }, { "n": 81, "q": "What is forbidden in the eighth commandment?", "a": "The eighth commandment forbids whatsoever does or may unjustly hinder our own or our neighbor's wealth or outward state." }, { "n": 82, "q": "Which is the ninth commandment?", "a": 'The ninth commandment is, "Thou shalt not bear false witness against thy neighbor."' }, { "n": 83, "q": "What is required in the ninth commandment?", "a": "The ninth commandment requires the maintaining and promoting of truth between man and man, and of our own and our neighbor's good name, especially in witness bearing." }, { "n": 84, "q": "What is forbidden in the ninth commandment?", "a": "The ninth commandment forbids whatsoever is pre- judicial to truth, or injurious to our own, or our neighbor's good name." }, { "n": 85, "q": "Which is the tenth commandment?", "a": "The tenth commandment is, \"Thou shalt not covet thy neighbor's house. Thou shalt not covet thy neighbor's wife, nor his man servant, nor his maid servant, nor his ox, nor his ass, nor anything that is thy neighbor's.\"" }, { "n": 86, "q": "What is required in the tenth commandment?", "a": "The tenth commandment requires full contentment with our own condition, with a right and charitable frame of spirit towards our neighbor, and all that is his." }, { "n": 87, "q": "What is forbidden in the tenth commandment?", "a": "The tenth commandment forbids all discontentment with our own estate, envying or grieving at the good of our neighbor, and all inordinate motions and affections to anything that is his." }, { "n": 88, "q": "Is any man able perfectly to keep the commandments of God?", "a": "No mere man, since the fall, is able in this life, perfectly to keep the commandments of God, but daily breaks them in thought, word, and deed." }, { "n": 89, "q": "What then is the purpose of the law since the fall?", "a": "The purpose of the law, since, the fall, is to reveal the perfect righteousness of God, that His people may know his will for their lives and the ungodly, being convicted of their sin, may be restrained therein and brought to Christ for salvation." }, { "n": 90, "q": "Are all transgressions of the law equally heinous?", "a": "Some sins in themselves and by reason of several aggravations, are more heinous in the sight of God than others." }, { "n": 91, "q": "What does every sin deserve?", "a": "Every sin deserves God's wrath and curse, both in this life, and in that which is to come." }, { "n": 92, "q": "What does God require of us, that we may escape His wrath and curse, due to us for sin?", "a": "To escape the wrath and curse of God due to us for sin, God requires of us faith in Jesus Christ, repentance unto life, with the diligent use of all the outward and ordinary means whereby Christ communicates to us the benefits of redemption." }, { "n": 93, "q": "What is faith in Jesus Christ?", "a": "Faith in Jesus Christ is a saving grace, whereby we receive and rest upon Him alone for salvation, as He is offered to us in the Gospel." }, { "n": 94, "q": "What is repentance unto life?", "a": "Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, does, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience." }, { "n": 95, "q": "What are the outward and ordinary means whereby Christ communicates to us the benefits of redemption?", "a": "The outward and ordinary means whereby Christ communicates to us the benefits of redemption are His ordinances, especially the Word, Baptism, the Lord's Supper and Prayer; all which are made effectual to the elect for salvation." }, { "n": 96, "q": "How is the Word made effectual to salvation?", "a": "The Spirit of God makes the reading, but especially the preaching of the Word an effectual means of convincing and converting sinners, and of building them up in holiness and comfort, through faith unto salvation." }, { "n": 97, "q": "How is the Word to be read and heard that it may become effectual to salvation?", "a": "That the Word may become effectual to salvation we must attend thereunto with diligence, preparation and prayer, receive it in faith and love, lay it up in our hearts and practice it in our lives." }, { "n": 98, "q": "How do Baptism and the Lord's Supper become effectual means of salvation?", "a": "Baptism and the Lord's Supper become effectual means of salvation, not from any virtue in them or in him that administers them, but only by the blessing of Christ and the working of His Spirit in them that by faith receive them." }, { "n": 99, "q": "Wherein do Baptism and the Lord's Supper differ from the other ordinances of God?", "a": "Baptism and the Lord's Supper differ from the other ordinances of God in that they were specially instituted by Christ to represent and apply to believers the benefits of the new covenant by visible and outward signs." }, { "n": 100, "q": "What is Baptism?", "a": "Baptism is an holy ordinance, wherein the washing with water in the name of the Father, the Son and the Holy Spirit, signifies our ingrafting into Christ and partaking of the benefits of the covenant of grace, and our engagement to be the Lord's." }, { "n": 101, "q": "To whom is Baptism to be administered?", "a": "Baptism is to be administered to all those who actually profess repentance towards God, faith in, and obedience to our Lord Jesus Christ; and to none other." }, { "n": 102, "q": "Are the infants of such as are professing believers to be baptized?", "a": "The infants of such as are professing believers are not to be baptized; because there is neither command nor example in the Holy Scriptures, or certain consequence from them, to baptize such." }, { "n": 103, "q": "How is Baptism rightly administered?", "a": "Baptism is rightly administered by immersion, or dipping the whole body of the person in water, in the name of the Father, and of the Son, and of the Holy Spirit." }, { "n": 104, "q": "What is the duty of those who are rightly baptized?", "a": "It is the duty of those who are rightly baptized to give up (join) themselves to some visible and orderly church of Jesus Christ, that they may walk in all the commandments and ordinances of the Lord blameless." }, { "n": 105, "q": "What is the visible church?", "a": "The visible church is the organized society of professing believers, in all ages and places, wherein the Gospel is truly preached and the ordinances of Baptism and the Lord's Supper rightly administered." }, { "n": 106, "q": "What is the invisible church?", "a": "The invisible church is the whole number of the elect, that have been, are, or shall be gathered into one under Christ the head." }, { "n": 107, "q": "What is the Lord's Supper?", "a": "The Lord's Supper is a holy ordinance, wherein, by giving and receiving bread and wine, according to Christ's appointment, His death is showed forth, and the worthy receivers are, not after a corporeal and carnal manner, but by faith, made partakers of His body and blood, with all His benefits, to their spiritual nourishment, and growth in grace." }, { "n": 108, "q": "What is required to the worthy receiving of the Lord's Supper?", "a": "It is required of them that would worthily (that is, suitably) partake of the Lord's Supper, that they examine themselves, of their knowledge to discern the Lord's body; of their faith to feed upon Him; of their repentance, love, and new obedience: lest, coming unworthily, they eat and drink judgment to themselves." }, { "n": 109, "q": "What is Prayer?", "a": "Prayer is an offering up of our desires to God, for things agreeable to His will, in the name of Christ, with confession of our sins and thankful acknowledgment of His mercies." }, { "n": 110, "q": "What rule has God given for our direction in prayer?", "a": "The whole Word of God is of use to direct us in prayer, but the special rule of direction is that prayer, which Christ taught His disciples, commonly called the Lord's Prayer." }, { "n": 111, "q": "What does the preface of the Lord's Prayer teach us?", "a": 'The preface of the Lord\'s Prayer, which is, "Our Father, which art in heaven," teaches us to draw near to God, with all holy reverence and confidence, as children to a father, able and ready to help us, and that we should pray with and for others.' }, { "n": 112, "q": "What do we pray for in the first petition?", "a": 'In the first petition, which is "Hallowed be thy name," we pray that God would enable us and others to glorify Him in all that whereby He makes Himself known, and that He would dispose all things to His own glory.' }, { "n": 113, "q": "What do we pray for in the second petition?", "a": 'In the second petition, which is "Thy kingdom come," we pray that satan\'s kingdom may be destroyed, and that the kingdom of grace may be advanced; ourselves and others brought into it, and kept in it, and that the kingdom of glory may be hastened.' }, { "n": 114, "q": "What do we pray for in the third petition?", "a": 'In the third petition, which is, "Thy will be done in earth as it is in heaven," we pray that God by His grace, would make us able and willing to know, obey, and submit to His will in all things, as the angels do in heaven.' }, { "n": 115, "q": "What do we pray for in the fourth petition?", "a": 'In the fourth petition, which is, "Give us this day our daily bread," we pray that of God\'s free gift, we may receive a competent portion of the good things of this life and enjoy His blessing with them.' }, { "n": 116, "q": "What do we pray for in the fifth petition?", "a": 'In the fifth petition, which is, "And forgive us our debts, as we forgive our debtors," we pray that God, for Christ\'s sake, would freely pardon all our sins; which we are the rather encouraged to ask, because by His grace we are enabled from the heart to forgive others.' }, { "n": 117, "q": "What do we pray for in the sixth petition?", "a": 'In the sixth petition, which is, "And lead us not into temptation, but deliver us from evil," we pray that God would either keep us from being tempted to sin, or support and deliver us when we are tempted.' }, { "n": 118, "q": "What does the conclusion of the Lord's Prayer teach us?", "a": 'The conclusion of the Lord\'s Prayer, which is, "For thine is the kingdom, and the power, and the glory, forever, Amen," teaches us to take our encouragement in prayer from God only, and in our prayers to praise Him, ascribing kingdom, power, and glory to Him; and in testimony of our desire, and assurance to be heard, we say, AMEN.' }] }, "wlc": { "name": "Westminster Larger Catechism", "short": "Westminster Larger", "blurb": "The full Westminster, 1647. For teens and grown-ups.", "chapters": [{ "label": "God's Word", "from": 1, "to": 5 }, { "label": "God", "from": 6, "to": 11 }, { "label": "Creation & providence", "from": 12, "to": 20 }, { "label": "The Fall", "from": 21, "to": 29 }, { "label": "Christ the Mediator", "from": 30, "to": 56 }, { "label": "Salvation & the church", "from": 57, "to": 90 }, { "label": "God's law", "from": 91, "to": 99 }, { "label": "Commandments 1–4", "from": 100, "to": 121 }, { "label": "Commandments 5–10", "from": 122, "to": 148 }, { "label": "Sin & repentance", "from": 149, "to": 153 }, { "label": "Word & sacraments", "from": 154, "to": 177 }, { "label": "Prayer", "from": 178, "to": 196 }], "items": [{ "n": 1, "q": "What is the chief and highest end of man?", "a": "Man's chief and highest end is to glorify God, and fully to enjoy him forever." }, { "n": 2, "q": "How doth it appear that there is a God?", "a": "The very light of nature in man, and the works of God, declare plainly that there is a God; but his word and Spirit only do sufficiently and effectually reveal him unto men for their salvation." }, { "n": 3, "q": "What is the word of God?", "a": "The holy scriptures of the Old and New Testaments are the word of God, the only rule of faith and obedience." }, { "n": 4, "q": "How doth it appear that the scriptures are the word of God?", "a": "The scriptures manifest themselves to be the word of God, by their majesty and purity; by the consent of all the parts, and the scope of the whole, which is to give all glory to God; by their light and power to convince and convert sinners, to comfort and build up believers unto salvation: but the Spirit of God bearing witness by and with the scriptures in the heart of man, is alone able fully to persuade it that they are the very word of God." }, { "n": 5, "q": "What do the scriptures principally teach?", "a": "The scriptures principally teach, what man is to believe concerning God, and what duty God requires of man." }, { "n": 6, "q": "What do the scriptures make known of God?", "a": "The scriptures make known what God is, the persons in the Godhead, his decrees, and the execution of his decrees." }, { "n": 7, "q": "What is God?", "a": "God is a Spirit, in and of himself infinite in being, glory, blessedness, and perfection; all-sufficient, eternal, unchangeable, incomprehensible, everywhere present, almighty, knowing all things, most wise, most holy, most just, most merciful and gracious, long-suffering, and abundant in goodness and truth." }, { "n": 8, "q": "Are there more Gods than one?", "a": "There is but one only, the living and true God." }, { "n": 9, "q": "How many persons are there in the Godhead?", "a": "There be three persons in the Godhead, the Father, the Son, and the Holy Ghost; and these three are one true, eternal God, the same in substance, equal in power and glory; although distinguished by their personal properties." }, { "n": 10, "q": "What are the personal properties of the three persons in the Godhead?", "a": "It is proper to the Father to beget the Son, and to the Son to be begotten of the Father, and to the Holy Ghost to proceed from the Father and the Son from all eternity." }, { "n": 11, "q": "How doth it appear that the Son and the Holy Ghost are God equal with the Father?", "a": "The scriptures manifest that the Son and the Holy Ghost are God equal with the Father, ascribing unto them such names, attributes, works, and worship, as are proper to God only." }, { "n": 12, "q": "What are the decrees of God?", "a": "God's decrees are the wise, free, and holy acts of the counsel of his will, whereby, from all eternity, he hath, for his own glory, unchangeably foreordained: Whatsoever comes to pass in time, especially concerning angels and men." }, { "n": 13, "q": "What hath God especially decreed concerning angels and men?", "a": "God, by an eternal and immutable decree, out of his mere love, for the praise of his glorious grace, to be manifested in due time, hath elected some angels to glory; and in Christ hath chosen some men to eternal life, and the means thereof: and also, according to his sovereign power, and the unsearchable counsel of his own will (whereby he extendeth or withholdeth favor as he pleases), hath passed by and foreordained the rest to dishonor and wrath, to be for their sin inflicted, to the praise of the glory of his justice." }, { "n": 14, "q": "How doth God execute his decrees?", "a": "God executeth his decrees in the works of creation and providence, according to his infallible foreknowledge, and the free and immutable counsel of his own will." }, { "n": 15, "q": "What is the work of creation?", "a": "The work of creation is that wherein God did in the beginning, by the word of his power, make of nothing the world, and all things therein, for himself, within the space of six days, and all very good." }, { "n": 16, "q": "How did God create angels?", "a": "God created all the angels spirits, immortal, holy, excelling in knowledge, mighty in power, to execute his commandments, and to praise his name, yet subject to change." }, { "n": 17, "q": "How did God create man?", "a": "After God had made all other creatures, he created man male and female; formed the body of the man of the dust of the ground, and the woman of the rib of the man, endued them with living, reasonable, and immortal souls; made them after his own image, in knowledge, righteousness,and holiness; having the law of God written in their hearts, and power to fulfil it, and dominion over the creatures; yet subject to fall." }, { "n": 18, "q": "What are God's works of providence?", "a": "God's works of providence are his most holy, wise, and powerful preserving and governing all his creatures; ordering them, and all their actions, to his own glory." }, { "n": 19, "q": "What is God's providence towards the angels?", "a": "God by his providence permitted some of the angels, wilfully and irrecoverably, to fall into sin and damnation, limiting and ordering that, and all their sins, to his own glory; and established the rest in holiness and happiness; employing them all, at his pleasure, in the administrations of his power, mercy, and justice." }, { "n": 20, "q": "What was the providence of God toward man in the estate in which he was created?", "a": "The providence of God toward man in the estate in which he was created, was the placing him in paradise, appointing him to dress it, giving him liberty to eat of the fruit of the earth; putting the creatures under his dominion, and ordaining marriage for his help; affording him communion with himself; instituting the sabbath; entering into a covenant of life with him, upon condition of personal, perfect, and perpetual obedience, of which the tree of life was a pledge; and forbidding to eat of the tree of the knowledge of good and evil, upon the pain of death." }, { "n": 21, "q": "Did man continue in that estate wherein God at first created him?", "a": "Our first parents being left to the freedom of their own will, through the temptation of Satan, transgressed the commandment of God in eating the forbidden fruit; and thereby fell from the estate of innocency wherein they were created." }, { "n": 22, "q": "Did all mankind fall in that first transgression?", "a": "The covenant being made with Adam as a public person, not for himself only, but for his posterity, all mankind descending from him by ordinary generation, sinned in him, and fell with him in that first transgression." }, { "n": 23, "q": "Into what estate did the fall bring mankind?", "a": "The fall brought mankind into an estate of sin and misery." }, { "n": 24, "q": "What is sin?", "a": "Sin is any want of conformity unto, or transgression of, any law of God, given as a rule to the reasonable creature." }, { "n": 25, "q": "Wherein consists the sinfulness of that estate whereinto man fell?", "a": "The sinfulness of that estate whereinto man fell, consisteth in the guilt of Adam's first sin, the want of that righteousness wherein he was created, and the corruption of his nature, whereby he is utterly indisposed, disabled, and made opposite unto all that is spiritually good, and wholly inclined to all evil, and that continually; which is commonly called Original Sin, and from which do proceed all actual transgressions." }, { "n": 26, "q": "How is original sin conveyed from our first parents unto their posterity?", "a": "Original sin is conveyed from our first parents unto their posterity by natural generation, so as all that proceed from them in that way are conceived and born in sin." }, { "n": 27, "q": "What misery did the fall bring upon mankind?", "a": "The fall brought upon mankind the loss of communion with God, his displeasure and curse; so as we are by nature children of wrath, bond slaves to Satan, and justly liable to all punishments in this world, and that which is to come." }, { "n": 28, "q": "What are the punishments of sin in this world?", "a": "The punishments of sin in this world are either inward, as blindness of mind, a reprobate sense, strong delusions, hardness of heart, horror of conscience, and vile affections; or outward, as the curse of God upon the creatures for our sakes, and all other evils that befall us in our bodies, names, estates, relations, and employments; together with death itself." }, { "n": 29, "q": "What are the punishments of sin in the world to come?", "a": "The punishments of sin in the world to come, are everlasting separation from the comfortable presence of God, and most grievous torments in soul and body, without intermission, in hell fire forever." }, { "n": 30, "q": "Doth God leave all mankind to perish in the estate of sin and misery?", "a": "God doth not leave all men to perish in the estate of sin and misery, into which they fell by the breach of the first covenant, commonly called the Covenant of Works; but of his mere love and mercy delivereth his elect out of it,
