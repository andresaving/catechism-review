/* Layout: one comic-page column — masthead panel, chapter chips, a grid of game panels, the mastery map; a game takes over the column.
   Single deliberate look: Defender Comic Style Spec (pale print field, ink, one electric yellow, violet accent). */
:root{
  --paper:#f2efe2; --paper-hi:#f8f5eb; --field:#c3cfe0; --steel:#8d9fc0; --steel-dk:#5d6f91;
  --ink:#11100d; --ink-soft:#3a372f;
  --yellow:#f2cf1d; --magenta:#d44d8a;
  --violet:#6b5ca5; --violet-dk:#463a78; --violet-lt:#d9d3ee;
  --good:#2f7a63; --good-lt:#cfe8dc; --bad:#a03b34; --bad-lt:#f1d3cf;
  --f-display:'Bangers','Impact','Arial Black',sans-serif;
  --f-label:'Oswald','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Kalam','Comic Sans MS','Chalkboard SE','Marker Felt',cursive;
  --bd:3px; --sh:6px 6px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
  --ghost:6px 6px 0 var(--ink), 10px 9px 0 rgba(212,77,138,.45);
  --snap:cubic-bezier(.25,.9,.3,1);
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--field)}
body{
  margin:0; color:var(--ink); font-family:var(--f-label); font-size:16px;
  background:
    radial-gradient(130% 70% at 50% -5%, var(--paper) 0%, var(--field) 62%, var(--steel) 140%) fixed,
    var(--field);
  min-height:100vh;
  padding-left:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:16px;padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:18px; padding-bottom:48px; /* iOS 10: no env() */
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
body::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--ink) .9px, transparent 1.2px);background-size:7px 7px;opacity:.06}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

/* ---------- masthead ---------- */
.mast{position:relative;background:var(--paper-hi);border:var(--bd) solid var(--ink);box-shadow:var(--ghost);
  padding:18px 20px 16px;transform:rotate(-.6deg);overflow:hidden}
.mast::before{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;
  border:22px solid var(--yellow);opacity:.55}

/* match up */

  transition:transform .15s var(--snap)}

/* modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:40;background:rgba(17,16,13,.55);display:grid;align-items:center;justify-items:center;place-items:center;
  padding:16px 16px 16px 16px;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}

/* battle */
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}

.foe::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;border:14px solid var(--yellow);top:14px;opacity:.6}

.arena::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;background-image:radial-gradient(var(--paper) .9px, transparent 1.2px);background-size:8px 8px;opacity:.08}
.arena .ring{position:absolute;width:230px;height:230px;border-radius:50%;border:18px solid var(--yellow);bottom:-40px;opacity:.75;box-shadow:-6px 6px 0 rgba(212,77,138,.5)}

.enemy{position:relative;z-index:1;width:200px;height:211px;margin-top:4px}

@keyframes hit{0%{transform:none;filter:none}15%{transform:translateX(18px) rotate(6deg) scale(.94);filter:brightness(5)}40%{transform:translateX(-10px) rotate(-3deg)}100%{transform:none;filter:none}}
.enemy.flee{transition:transform .9s ease-in, opacity .9s;transform:translate(260px,-60px) rotate(25deg) scale(.6);opacity:0}
.boom{position:absolute;z-index:3;top:40%;left:50%;font-family:var(--f-display);font-size:96px;font-size:clamp(56px,14vw,96px);color:var(--yellow);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--magenta);opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.4);pointer-events:none;white-space:nowrap}

@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-6deg) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) rotate(-4deg) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) rotate(-4deg) scale(1)}}

@keyframes fadein{from{opacity:0}to{opacity:1}}

.foot{text-align:center;font-size:11px;letter-spacing:.32em;font-weight:600;color:var(--ink-soft)}
/* transitions: screens slide the way you are going, each new question rises in */
@keyframes tx-fwd{from{opacity:0;transform:translateX(28px)}}
@keyframes tx-back{from{opacity:0;transform:translateX(-28px)}}
@keyframes tx-up{from{opacity:0;transform:translateY(10px)}}
@keyframes tx-fade{from{opacity:0}}
@keyframes tx-sheet{from{opacity:0;transform:translateY(16px) scale(.97)}}
.tx-fwd{animation:tx-fwd .26s var(--ease-out) backwards}
.tx-back{animation:tx-back .26s var(--ease-out) backwards}
.tx-up{animation:tx-up .22s var(--ease-out) backwards}
.tx-fade{animation:tx-fade .16s var(--ease-out) backwards}
.modal.tx-open{animation:tx-fade .2s var(--ease-out) backwards}
.modal.tx-open .inner{animation:tx-sheet .28s var(--ease-out) backwards}
/* closing: the sheet drops back the way it came, a little quicker than it opened */
@keyframes tx-fade-out{to{opacity:0}}
@keyframes tx-sheet-out{to{opacity:0;transform:translateY(16px) scale(.97)}}
.modal.tx-close{animation:tx-fade-out .2s var(--ease-out) forwards;pointer-events:none}
.modal.tx-close .inner{animation:tx-sheet-out .2s var(--ease-out) forwards}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .tx-fwd,.tx-back,.tx-up,.tx-fade,.modal.tx-open,.modal.tx-open .inner{animation:tx-fade .2s ease-out backwards!important}
  .modal.tx-close{animation:tx-fade-out .2s ease-out forwards!important}
}

const WSC_SHORTER = [{ "n": 1, "q": "What is the chief end of man?", "a": "Man's chief end is to glorify God, and to enjoy him forever." }, { "n": 2, "q": "What rule hath God given to direct us how we may glorify and enjoy him?", "a": "The Word of God, which is contained in the Scriptures of the Old and New Testaments, is the only rule to direct us how we may glorify and enjoy him." }, { "n": 3, "q": "What do the Scriptures principally teach?", "a": "The Scriptures principally teach what man is to believe concerning God, and what duty God requires of man." }, { "n": 4, "q": "What is God?", "a": "God is a Spirit, infinite, eternal, and unchangeable, in his being, wisdom, power, holiness, justice, goodness, and truth." }, { "n": 5, "q": "Are there more Gods than one?", "a": "There is but one only, the living and true God." }, { "n": 6, "q": "How many persons are there in the Godhead?", "a": "There are three persons in the Godhead; the Father, the Son, and the Holy Ghost; and these three are one God, the same in substance, equal in power and glory." }, { "n": 7, "q": "What are the decrees of God?", "a": "The decrees of God are his eternal purpose, according to the counsel of his will, whereby, for his own glory, he hath foreordained whatsoever comes to pass." }, { "n": 8, "q": "How doth God execute his decrees?", "a": "God executeth his decrees in the works of creation and providence." }, { "n": 9, "q": "What is the work of creation?", "a": "The work of creation is God's making all things of nothing, by the word of his power, in the space of six days, and all very good." }, { "n": 10, "q": "How did God create man?", "a": "God created man male and female, after his own image, in knowledge, righteousness, and holiness, with dominion over the creatures." }, { "n": 11, "q": "What are God's works of providence?", "a": "God's works of providence are his most holy, wise, and powerful preserving and governing all his creatures, and all their actions." }, { "n": 12, "q": "What special act of providence did God exercise toward man in the estate wherein he was created?", "a": "When God had created man, he entered into a covenant of life with him, upon condition of perfect obedience; forbidding him to eat of the tree of the knowledge of good and evil, upon the pain of death." }, { "n": 13, "q": "Did our first parents continue in the estate wherein they were created?", "a": "Our first parents, being left to the freedom of their own will, fell from the estate wherein they were created, by sinning against God." }, { "n": 14, "q": "What is sin?", "a": "Sin is any want of conformity unto, or transgression of, the law of God." }, { "n": 15, "q": "What was the sin whereby our first parents fell from the estate wherein they were created?", "a": "The sin whereby our first parents fell from the estate wherein they were created, was their eating the forbidden fruit." }, { "n": 16, "q": "Did all mankind fall in Adam's first transgression?", "a": "The covenant being made with Adam, not only for himself, but for his posterity; all mankind, descending from him by ordinary generation, sinned in him, and fell with him, in his first transgression." }, { "n": 17, "q": "Into what estate did the fall bring mankind?", "a": "The fall brought mankind into an estate of sin and misery." }, { "n": 18, "q": "Wherein consists the sinfulness of that estate whereinto man fell?", "a": "The sinfulness of that estate whereinto man fell, consists in the guilt of Adam's first sin, the want of original righteousness, and the corruption of his whole nature, which is commonly called original sin; together with all actual transgressions which proceed from it." }, { "n": 19, "q": "What is the misery of that estate whereinto man fell?", "a": "All mankind by their fall lost communion with God, are under his wrath and curse, and so made liable to all the miseries in this life, to death itself, and to the pains of hell forever." }, { "n": 20, "q": "Did God leave all mankind to perish in the estate of sin and misery?", "a": "God having, out of his mere good pleasure, from all eternity, elected some to everlasting life, did enter into a covenant of grace, to deliver them out of the estate of sin and misery, and to bring them into an estate of salvation by a Redeemer." }, { "n": 21, "q": "Who is the Redeemer of God's elect?", "a": "The only Redeemer of God's elect is the Lord Jesus Christ, who, being the eternal Son of God, became man, and so was, and continueth to be, God and man in two distinct natures, and one person, forever." }, { "n": 22, "q": "How did Christ, being the Son of God, become man?", "a": "Christ, the Son of God, became man, by taking to himself a true body and a reasonable soul, being conceived by the power of the Holy Ghost in the womb of the virgin Mary, and born of her, yet without sin." }, { "n": 23, "q": "What offices doth Christ execute as our Redeemer?", "a": "Christ, as our Redeemer, executeth the offices of a prophet, of a priest, and of a king, both in his estate of humiliation and exaltation." }, { "n": 24, "q": "How doth Christ execute the office of a prophet?", "a": "Christ executeth the office of a prophet, in revealing to us, by his word and Spirit, the will of God for our salvation." }, { "n": 25, "q": "How doth Christ execute the office of a priest?", "a": "Christ executeth the office of a priest, in his once offering up of himself a sacrifice to satisfy divine justice, and reconcile us to God; and in making continual intercession for us." }, { "n": 26, "q": "How doth Christ execute the office of a king?", "a": "Christ executeth the office of a king, in subduing us to himself, in ruling and defending us, and in restraining and conquering all his and our enemies." }, { "n": 27, "q": "Wherein did Christ's humiliation consist?", "a": "Christ's humiliation consisted in his being born, and that in a low condition, made under the law, undergoing the miseries of this life, the wrath of God, and the cursed death of the cross; in being buried, and continuing under the power of death for a time." }, { "n": 28, "q": "Wherein consisteth Christ's exaltation?", "a": "Christ's exaltation consisteth in his rising again from the dead on the third day, in ascending up into heaven, in sitting at the right hand of God the Father, and in coming to judge the world at the last day." }, { "n": 29, "q": "How are we made partakers of the redemption purchased by Christ?", "a": "We are made partakers of the redemption purchased by Christ, by the effectual application of it to us by his Holy Spirit." }, { "n": 30, "q": "How doth the Spirit apply to us the redemption purchased by Christ?", "a": "The Spirit applieth to us the redemption purchased by Christ, by working faith in us, and thereby uniting us to Christ in our effectual calling." }, { "n": 31, "q": "What is effectual calling?", "a": "Effectual calling is the work of God's Spirit, whereby, convincing us of our sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, he doth persuade and enable us to embrace Jesus Christ, freely offered to us in the gospel." }, { "n": 32, "q": "What benefits do they that are effectually called partake of in this life?", "a": "They that are effectually called do in this life partake of justification, adoption, and sanctification, and the several benefits which, in this life, do either accompany or flow from them." }, { "n": 33, "q": "What is justification?", "a": "Justification is an act of God's free grace, wherein he pardoneth all our sins, and accepteth us as righteous in his sight, only for the righteousness of Christ imputed to us, and received by faith alone." }, { "n": 34, "q": "What is adoption?", "a": "Adoption is an act of God's free grace, whereby we are received into the number, and have a right to all the privileges of the sons of God." }, { "n": 35, "q": "What is sanctification?", "a": "Sanctification is the work of God's free grace, whereby we are renewed in the whole man after the image of God, and are enabled more and more to die unto sin, and live unto righteousness." }, { "n": 36, "q": "What are the benefits which in this life do accompany or flow from justification, adoption, and sanctification?", "a": "The benefits which in this life do accompany or flow from justification, adoption, and sanctification, are, assurance of God's love, peace of conscience, joy in the Holy Ghost, increase of grace, and perseverance therein to the end." }, { "n": 37, "q": "What benefits do believers receive from Christ at death?", "a": "The souls of believers are at their death made perfect in holiness, and do immediately pass into glory; and their bodies, being still united to Christ, do rest in their graves till the resurrection." }, { "n": 38, "q": "What benefits do believers receive from Christ at the resurrection?", "a": "At the resurrection, believers being raised up in glory, shall be openly acknowledged and acquitted in the day of judgment, and made perfectly blessed in the full enjoying of God to all eternity." }, { "n": 39, "q": "What is the duty which God requireth of man?", "a": "The duty which God requireth of man, is obedience to his revealed will." }, { "n": 40, "q": "What did God at first reveal to man for the rule of his obedience?", "a": "The rule which God at first revealed to man for his obedience, was the moral law." }, { "n": 41, "q": "Where is the moral law summarily comprehended?", "a": "The moral law is summarily comprehended in the ten commandments." }, { "n": 42, "q": "What is the sum of the ten commandments?", "a": "The sum of the ten commandments is, to love the Lord our God with all our heart, with all our soul, with all our strength, and with all our mind; and our neighbour as ourselves." }, { "n": 43, "q": "What is the preface to the ten commandments?", "a": "The preface to the ten commandments is in these words, I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage." }, { "n": 44, "q": "What doth the preface to the ten commandments teach us?", "a": "The preface to the ten commandments teacheth us, That because God is the Lord, and our God, and Redeemer, therefore we are bound to keep all his commandments." }, { "n": 45, "q": "Which is the first commandment?", "a": "The first commandment is, Thou shalt have no other gods before me." }, { "n": 46, "q": "What is required in the first commandment?", "a": "The first commandment requireth us to know and acknowledge God to be the only true God, and our God; and to worship and glorify him accordingly." }, { "n": 47, "q": "What is forbidden in the first commandment?", "a": "The first commandment forbiddeth the denying, or not worshipping and glorifying the true God as God, and our God; and the giving of that worship and glory to any other, which is due to him alone." }, { "n": 48, "q": "What are we specially taught by these words [before me] in the first commandment?", "a": "These words [before me] in the first commandment teach us, That God, who seeth all things, taketh notice of, and is much displeased with, the sin of having any other God." }, { "n": 49, "q": "Which is the second commandment?", "a": "The second commandment is, Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me; and shewing mercy unto thousands of them that love me, and keep my commandments." }, { "n": 50, "q": "What is required in the second commandment?", "a": "The second commandment requireth the receiving, observing, and keeping pure and entire, all such religious worship and ordinances as God hath appointed in his word." }, { "n": 51, "q": "What is forbidden in the second commandment?", "a": "The second commandment forbiddeth the worshipping of God by images, or any other way not appointed in his word." }, { "n": 52, "q": "What are the reasons annexed to the second commandment?", "a": "The reasons annexed to the second commandment are, God's sovereignty over us, his propriety in us, and the zeal he hath to his own worship." }, { "n": 53, "q": "Which is the third commandment?", "a": "The third commandment is, Thou shalt not take the name of the LORD thy God in vain: for the LORD will not hold him guiltless that taketh his name in vain." }, { "n": 54, "q": "What is required in the third commandment?", "a": "The third commandment requireth the holy and reverent use of God's names, titles, attributes, ordinances, word, and works." }, { "n": 55, "q": "What is forbidden in the third commandment?", "a": "The third commandment forbiddeth all profaning or abusing of any thing whereby God maketh himself known." }, { "n": 56, "q": "What is the reason annexed to the third commandment?", "a": "The reason annexed to the third commandment is, That however the breakers of this commandment may escape punishment from men, yet the LORD our God will not suffer them to escape his righteous judgment." }, { "n": 57, "q": "Which is the fourth commandment?", "a": "The fourth commandment is, Remember the sabbath day, to keep it holy. Six days shalt thou labour, and do all thy work: but the seventh day is the sabbath of the LORD thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: for in six days the LORD made heaven and earth, the sea, and all that in them is, and rested the seventh day: wherefore the LORD blessed the sabbath day, and hallowed it." }, { "n": 58, "q": "What is required in the fourth commandment?", "a": "The fourth commandment requireth the keeping holy to God such set times as he hath appointed in his word; expressly one whole day in seven, to be a holy sabbath to himself." }, { "n": 59, "q": "Which day of the seven hath God appointed to be the weekly sabbath?", "a": "From the beginning of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly sabbath; and the first day of the week ever since, to continue to the end of the world, which is the Christian sabbath." }, { "n": 60, "q": "How is the sabbath to be sanctified?", "a": "The sabbath is to be sanctified by a holy resting all that day, even from such worldly employments and recreations as are lawful on other days; and spending the whole time in the public and private exercises of God's worship, except so much as is to be taken up in the works of necessity and mercy." }, { "n": 61, "q": "What is forbidden in the fourth commandment?", "a": "The fourth commandment forbiddeth the omission, or careless performance, of the duties required, and the profaning the day by idleness, or doing that which is in itself sinful, or by unnecessary thoughts, words, or works, about our worldly employments or recreations." }, { "n": 62, "q": "What are the reasons annexed to the fourth commandment?", "a": "The reasons annexed to the fourth commandment are, God's allowing us six days of the week for our own employments, his challenging a special propriety in the seventh, his own example, and his blessing the sabbath day." }, { "n": 63, "q": "Which is the fifth commandment?", "a": "The fifth commandment is, Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee." }, { "n": 64, "q": "What is required in the fifth commandment?", "a": "The fifth commandment requireth the preserving the honour, and performing the duties, belonging to every one in their several places and relations, as superiors, inferiors, or equals." }, { "n": 65, "q": "What is forbidden in the fifth commandment?", "a": "The fifth commandment forbiddeth the neglecting of, or doing any thing against, the honour and duty which belongeth to every one in their several places and relations." }, { "n": 66, "q": "What is the reason annexed to the fifth commandment?", "a": "The reason annexed to the fifth commandment is, a promise of long life and prosperity (as far as it shall serve for God's glory and their own good) to all such as keep this commandment." }, { "n": 67, "q": "Which is the sixth commandment?", "a": "The sixth commandment is, Thou shalt not kill." }, { "n": 68, "q": "What is required in the sixth commandment?", "a": "The sixth commandment requireth all lawful endeavours to preserve our own life, and the life of others." }, { "n": 69, "q": "What is forbidden in the sixth commandment?", "a": "The sixth commandment forbiddeth the taking away of our own life, or the life of our neighbour unjustly, or whatsoever tendeth thereunto." }, { "n": 70, "q": "Which is the seventh commandment?", "a": "The seventh commandment is, Thou shalt not commit adultery." }, { "n": 71, "q": "What is required in the seventh commandment?", "a": "The seventh commandment requireth the preservation of our own and our neighbour's chastity, in heart, speech, and behaviour." }, { "n": 72, "q": "What is forbidden in the seventh commandment?", "a": "The seventh commandment forbiddeth all unchaste thoughts, words, and actions." }, { "n": 73, "q": "Which is the eighth commandment?", "a": "The eighth commandment is, Thou shalt not steal." }, { "n": 74, "q": "What is required in the eighth commandment?", "a": "The eighth commandment requireth the lawful procuring and furthering the wealth and outward estate of ourselves and others." }, { "n": 75, "q": "What is forbidden in the eighth commandment?", "a": "The eighth commandment forbiddeth whatsoever doth, or may, unjustly hinder our own, or our neighbour's, wealth or outward estate." }, { "n": 76, "q": "Which is the ninth commandment?", "a": "The ninth commandment is, Thou shalt not bear false witness against thy neighbour." }, { "n": 77, "q": "What is required in the ninth commandment?", "a": "The ninth commandment requireth the maintaining and promoting of truth between man and man, and of our own and our neighbour's good name, especially in witness-bearing." }, { "n": 78, "q": "What is forbidden in the ninth commandment?", "a": "The ninth commandment forbiddeth whatsoever is prejudicial to truth, or injurious to our own or our neighbour's good name." }, { "n": 79, "q": "Which is the tenth commandment?", "a": "The tenth commandment is, Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is thy neighbour's." }, { "n": 80, "q": "What is required in the tenth commandment?", "a": "The tenth commandment requireth full contentment with our own condition, with a right and charitable frame of spirit toward our neighbour, and all that is his." }, { "n": 81, "q": "What is forbidden in the tenth commandment?", "a": "The tenth commandment forbiddeth all discontentment with our own estate, envying or grieving at the good of our neighbour, and all inordinate motions and affections to any thing that is his." }, { "n": 82, "q": "Is any man able perfectly to keep the commandments of God?", "a": "No mere man, since the fall, is able in this life perfectly to keep the commandments of God, but doth daily break them in thought, word, and deed." }, { "n": 83, "q": "Are all transgressions of the law equally heinous?", "a": "Some sins in themselves, and by reason of several aggravations, are more heinous in the sight of God than others." }, { "n": 84, "q": "What doth every sin deserve?", "a": "Every sin deserveth God's wrath and curse, both in this life, and that which is to come." }, { "n": 85, "q": "What doth God require of us, that we may escape his wrath and curse due to us for sin?", "a": "To escape the wrath and curse of God due to us for sin, God requireth of us faith in Jesus Christ, repentance unto life, with the diligent use of all the outward means whereby Christ communicateth to us the benefits of redemption." }, { "n": 86, "q": "What is faith in Jesus Christ?", "a": "Faith in Jesus Christ is a saving grace, whereby we receive and rest upon him alone for salvation, as he is offered to us in the gospel." }, { "n": 87, "q": "What is repentance unto life?", "a": "Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, doth, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavour after, new obedience." }, { "n": 88, "q": "What are the outward and ordinary means whereby Christ communicateth to us the benefits of redemption?", "a": "The outward and ordinary means whereby Christ communicateth to us the benefits of redemption, are his ordinances, especially the word, sacraments, and prayer; all which are made effectual to the elect for salvation." }, { "n": 89, "q": "How is the word made effectual to salvation?", "a": "The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of convincing and converting sinners, and of building them up in holiness and comfort, through faith, unto salvation." }, { "n": 90, "q": "How is the word to be read and heard, that it may become effectual to salvation?", "a": "That the word may become effectual to salvation, we must attend thereunto with diligence, preparation, and prayer; receive it with faith and love, lay it up in our hearts, and practise it in our lives." }, { "n": 91, "q": "How do the sacraments become effectual means of salvation?", "a": "The sacraments become effectual means of salvation, not from any virtue in them, or in him that doth administer them; but only by the blessing of Christ, and the working of his Spirit in them that by faith receive them." }, { "n": 92, "q": "What is a sacrament?", "a": "A sacrament is a holy ordinance instituted by Christ; wherein, by sensible signs, Christ, and the benefits of the new covenant, are represented, sealed, and applied to believers." }, { "n": 93, "q": "Which are the sacraments of the New Testament?", "a": "The sacraments of the New Testament are, baptism, and the Lord's supper." }, { "n": 94, "q": "What is baptism?", "a": "Baptism is a sacrament, wherein the washing with water in the name of the Father, and of the Son, and of the Holy Ghost, doth signify and seal our ingrafting into Christ, and partaking of the benefits of the covenant of grace, and our engagement to be the Lord's." }, { "n": 95, "q": "To whom is baptism to be administered?", "a": "Baptism is not to be administered to any that are out of the visible church, till they profess their faith in Christ, and obedience to him; but the infants of such as are members of the visible church are to be baptized." }, { "n": 96, "q": "What is the Lord's supper?", "a": "The Lord's supper is a sacrament, wherein, by giving and receiving bread and wine, according to Christ's appointment, his death is shewed forth; and the worthy receivers are, not after a corporal and carnal manner, but by faith, made partakers of his body and blood, with all his benefits, to their spiritual nourishment, and growth in grace." }, { "n": 97, "q": "What is required to the worthy receiving of the Lord's supper?", "a": "It is required of them that would worthily partake of the Lord's supper, that they examine themselves of their knowledge to discern the Lord's body, of their faith to feed upon him, of their repentance, love, and new obedience; lest, coming unworthily, they eat and drink judgment to themselves." }, { "n": 98, "q": "What is prayer?", "a": "Prayer is an offering up of our desires unto God, for things agreeable to his will, in the name of Christ, with confession of our sins, and thankful acknowledgment of his mercies." }, { "n": 99, "q": "What rule hath God given for our direction in prayer?", "a": "The whole word of God is of use to direct us in prayer; but the special rule of direction is that form of prayer which Christ taught his disciples, commonly called the Lord's prayer." }, { "n": 100, "q": "What doth the preface of the Lord's prayer teach us?", "a": "The preface of the Lord's prayer, which is, Our Father which art in heaven, teacheth us to draw near to God with all holy reverence and confidence, as children to a father, able and ready to help us; and that we should pray with and for others." }, { "n": 101, "q": "What do we pray for in the first petition?", "a": "In the first petition, which is, Hallowed be thy name, we pray, That God would enable us and others to glorify him in all that whereby he maketh himself known; and that he would dispose all things to his own glory." }, { "n": 102, "q": "What do we pray for in the second petition?", "a": "In the second petition, which is, Thy kingdom come, we pray, That Satan's kingdom may be destroyed; and that the kingdom of grace may be advanced, ourselves and others brought into it, and kept in it; and that the kingdom of glory may be hastened." }, { "n": 103, "q": "What do we pray for in the third petition?", "a": "In the third petition, which is, Thy will be done in earth, as it is in heaven, we pray, That God, by his grace, would make us able and willing to know, obey, and submit to his will in all things, as the angels do in heaven." }, { "n": 104, "q": "What do we pray for in the fourth petition?", "a": "In the fourth petition, which is, Give us this day our daily bread, we pray, That of God's free gift we may receive a competent portion of the good things of this life, and enjoy his blessing with them." }, { "n": 105, "q": "What do we pray for in the fifth petition?", "a": "In the fifth petition, which is, And forgive us our debts, as we forgive our debtors, we pray, That God, for Christ's sake, would freely pardon all our sins; which we are the rather encouraged to ask, because by his grace we are enabled from the heart to forgive others." }, { "n": 106, "q": "What do we pray for in the sixth petition?", "a": "In the sixth petition, which is, And lead us not into temptation, but deliver us from evil, we pray, That God would either keep us from being tempted to sin, or support and deliver us when we are tempted." }, { "n": 107, "q": "What doth the conclusion of the Lord's prayer teach us?", "a": "The conclusion of the Lord's prayer, which is, For thine is the kingdom, and the power, and the glory, for ever, Amen, teacheth us to take our encouragement in prayer from God only, and in our prayers to praise him, ascribing kingdom, power, and glory to him. And, in testimony of our desire, and assurance to be heard, we say, Amen." }];
const CATS = { "ycc": { "name": "Catechism for Young Children", "short": "Young Children", "blurb": "Short answers for little ones. Engles, 1840.", "chapters": [{ "label": "God & creation", "from": 1, "to": 16 }, { "label": "The Fall & sin", "from": 17, "to": 38 }, { "label": "Salvation", "from": 39, "to": 60 }, { "label": "Christ's offices", "from": 61, "to": 72 }, { "label": "The Ten Commandments", "from": 73, "to": 104 }, { "label": "Prayer", "from": 105, "to": 121 }, { "label": "The sacraments", "from": 122, "to": 136 }, { "label": "Last things", "from": 137, "to": 145 }], "items": [{ "n": 1, "q": "Who made you?", "a": "God." }, { "n": 2, "q": "What else did God make?", "a": "God made all things." }, { "n": 3, "q": "Why did God make you and all things?", "a": "For his own glory." }, { "n": 4, "q": "How can you glorify God?", "a": "By loving him and doing what he commands." }, { "n": 5, "q": "Why ought you to glorify God?", "a": "Because he made me and takes care of me." }, { "n": 6, "q": "Are there more gods than one?", "a": "There is only one God." }, { "n": 7, "q": "In how many persons does this one God exist?", "a": "In three persons." }, { "n": 8, "q": "In how many persons does this one God exist — what are they?", "a": "The Father, the Son and the Holy Ghost." }, { "n": 9, "q": "What is God?", "a": "God is a Spirit, and has not a body like men." }, { "n": 10, "q": "Where is God?", "a": "God is everywhere." }, { "n": 11, "q": "Can you see God?", "a": "No; I cannot see God, but he always sees me." }, { "n": 12, "q": "Does God know all things?", "a": "Yes; nothing can be hid from God." }, { "n": 13, "q": "Can God do all things?", "a": "Yes; God can do all his holy will." }, { "n": 14, "q": "Where do you learn how to love and obey God?", "a": "In the Bible alone." }, { "n": 15, "q": "Who wrote the Bible?", "a": "Holy men who were taught by the Holy Ghost." }, { "n": 16, "q": "Who were our first parents?", "a": "Adam and Eve." }, { "n": 17, "q": "Of what were our first parents made?", "a": "God made the body of Adam out of the ground, and formed Eve from the body of Adam." }, { "n": 18, "q": "What did God give Adam and Eve besides bodies?", "a": "He gave them souls that could never die." }, { "n": 19, "q": "Have you a soul as well as a body?", "a": "Yes; I have a soul that can never die." }, { "n": 20, "q": "How do you know that you have a soul?", "a": "Because I can think about God and the world to come." }, { "n": 21, "q": "In what condition did God make Adam and Eve?", "a": "He made them holy and happy." }, { "n": 22, "q": "What is a covenant?", "a": "An agreement between two or more persons." }, { "n": 23, "q": "What covenant did God make with Adam?", "a": "The covenant of works." }, { "n": 24, "q": "What was Adam bound to do by the covenant of works?", "a": "To obey God perfectly." }, { "n": 25, "q": "What did God promise in the covenant of works?", "a": "To reward Adam with life if he obeyed him." }, { "n": 26, "q": "What did God threaten in the covenant of works?", "a": "To punish Adam with death if he disobeyed." }, { "n": 27, "q": "Did Adam keep the covenant of works?", "a": "No; he sinned against God." }, { "n": 28, "q": "What is sin?", "a": "Sin is any want of conformity unto, or transgression of, the law of God." }, { "n": 29, "q": "What is meant by want of conformity?", "a": "Not being or doing what God requires." }, { "n": 30, "q": "What is meant by transgression?", "a": "Doing what God forbids." }, { "n": 31, "q": "What was the sin of our first parents?", "a": "Eating the forbidden fruit." }, { "n": 32, "q": "Who tempted them to this sin?", "a": "The devil tempted Eve, and she gave the fruit to Adam." }, { "n": 33, "q": "What befell our first parents when they had sinned?", "a": "Instead of being holy and happy, they became sinful and miserable." }, { "n": 34, "q": "Did Adam act for himself alone in the covenant of works?", "a": "No; he represented all his posterity." }, { "n": 35, "q": "What effect had the sin of Adam on all mankind?", "a": "All mankind are born in a state of sin and misery." }, { "n": 36, "q": "What is that sinful nature which we inherit from Adam called?", "a": "Original sin." }, { "n": 37, "q": "What does every sin deserve?", "a": "The wrath and curse of God." }, { "n": 38, "q": "Can any one go to heaven with this sinful nature?", "a": "No, our hearts must be changed before we can be fit for heaven." }, { "n": 39, "q": "What is a change of heart called?", "a": "Regeneration." }, { "n": 40, "q": "Who can change a sinner's heart?", "a": "The Holy Spirit alone." }, { "n": 41, "q": "Can any one be saved through the covenant of works?", "a": "None can be saved through the covenant of works." }, { "n": 42, "q": "Why can none be saved through the covenant of works?", "a": "Because all have broken it, and are condemned by it." }, { "n": 43, "q": "With whom did God the Father make the covenant of grace?", "a": "With Christ, his eternal Son." }, { "n": 44, "q": "Whom did Christ represent in the covenant of grace?", "a": "His elect people." }, { "n": 45, "q": "What did Christ undertake in the covenant of grace?", "a": "To keep the whole law for his people, and to suffer the punishment due to their sins." }, { "n": 46, "q": "Did our Lord Jesus Christ ever commit the least sin?", "a": "No; he was holy, harmless and undefiled." }, { "n": 47, "q": "How could the Son of God suffer?", "a": "Christ, the Son of God, became man that he might obey and suffer in our nature." }, { "n": 48, "q": "What is meant by the Atonement?", "a": "Christ's satisfying divine justice, by his sufferings and death, in the place of sinners." }, { "n": 49, "q": "What did God the Father undertake in the covenant of grace?", "a": "To justify and sanctify those for whom Christ should die." }, { "n": 50, "q": "What is justification?", "a": "It is God's forgiving sinners, and treating them as if they had never sinned." }, { "n": 51, "q": "What is sanctification?", "a": "It is God's making sinners holy in heart and conduct." }, { "n": 52, "q": "For whom did Christ obey and suffer?", "a": "For those whom the Father had given him." }, { "n": 53, "q": "What kind of life did Christ live on earth?", "a": "A life of poverty and suffering." }, { "n": 54, "q": "What kind of death did Christ die?", "a": "The painful and shameful death of the cross." }, { "n": 55, "q": "Who will be saved?", "a": "Only those who repent of sin, believe in Christ and lead holy lives." }, { "n": 56, "q": "What is it to repent?", "a": "To be sorry for sin, and to hate and forsake it because it is displeasing to God." }, { "n": 57, "q": "What is it to believe or have faith in Christ?", "a": "To trust in Christ alone for salvation." }, { "n": 58, "q": "Can you repent and believe in Christ by your own power?", "a": "No; I can do nothing good without the help of God's Holy Spirit." }, { "n": 59, "q": "How can you get the help of the Holy Spirit?", "a": "God has told us that we must pray to him for the Holy Spirit." }, { "n": 60, "q": "How long ago is it since Christ died?", "a": "More than eighteen hundred years." }, { "n": 61, "q": "How were pious persons saved before the coming of Christ if", "a": "By believing in a Saviour to come." }, { "n": 62, "q": "How did they show their faith?", "a": "By offering sacrifices on God's altar." }, { "n": 63, "q": "What did these sacrifices represent?", "a": "Christ, the Lamb of God, who was to die for sinners." }, { "n": 64, "q": "What offices has Christ?", "a": "Christ has three offices." }, { "n": 65, "q": "What offices has Christ — what are they?", "a": "The offices of a prophet, of a priest, and of a king." }, { "n": 66, "q": "How is Christ a prophet?", "a": "Because he teaches us the will of God." }, { "n": 67, "q": "How is Christ a priest?", "a": "Because he died for our sins and pleads with God for us." }, { "n": 68, "q": "How is Christ a king?", "a": "Because he rules over us and defends us." }, { "n": 69, "q": "Why do you need Christ as a prophet?", "a": "Because I am ignorant." }, { "n": 70, "q": "Why do you need Christ as a priest?", "a": "Because I am guilty." }, { "n": 71, "q": "Why do you need Christ as a king?", "a": "Because I am weak and helpless." }, { "n": 72, "q": "How many commandments did God give on Mount Sinai?", "a": "Ten commandments." }, { "n": 73, "q": "What are the ten commandments sometimes called?", "a": "The Decalogue." }, { "n": 74, "q": "What do the first four commandments teach?", "a": "Our duty to God." }, { "n": 75, "q": "What do the last six commandments teach?", "a": "Our duty to our fellow-men." }, { "n": 76, "q": "What is the sum of the ten commandments?", "a": "To love God with all my heart, and my neighbor as myself." }, { "n": 77, "q": "Who is your neighbor?", "a": "All my fellow-men are my neighbors." }, { "n": 78, "q": "Is God pleased with those who love and obey him?", "a": "Yes; he says, 'I love them that love me.'" }, { "n": 79, "q": "Is God displeased with those who do not love and obey him?", "a": "Yes; 'God is angry with the wicked every day.'" }, { "n": 80, "q": "What is the first commandment?", "a": "The first commandment is, Thou shalt have no other gods before me." }, { "n": 81, "q": "What does the first commandment teach us?", "a": "To worship God alone." }, { "n": 82, "q": "What is the second commandment?", "a": "The second commandment is, Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth. Thou shalt not bow down thyself to them, nor serve them; for I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, unto the third and fourth generation of them that hate me; and showing mercy unto thousands of them that love me and keep my commandments." }, { "n": 83, "q": "What does the second commandment teach us?", "a": "To worship God in a proper manner, and to avoid idolatry." }, { "n": 84, "q": "What is the third commandment?", "a": "The third commandment is, Thou shalt not take the name of the Lord thy God in vain; for the Lord will not hold him guiltless that taketh his name in vain." }, { "n": 85, "q": "What does the third commandment teach us?", "a": "To reverence God's name, word, and works." }, { "n": 86, "q": "What is the fourth commandment?", "a": "The fourth commandment is, Remember the Sabbath day to keep it holy. Six days shalt thou labor and do all thy work; but the seventh day is the Sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy man-servant, nor thy maid-servant, nor thy cattle, nor thy stranger that is within thy gates: for in six days the Lord made heaven and earth, the sea, and all that in them is, and rested on the seventh day: wherefore the Lord blessed the Sabbath day, and hallowed it." }, { "n": 87, "q": "What does the fourth commandment teach us?", "a": "To keep the Sabbath holy." }, { "n": 88, "q": "What day of the week is the Christian Sabbath?", "a": "The first day of the week, called the Lord's day." }, { "n": 89, "q": "Why is it called the Lord's day?", "a": "Because on that day Christ rose from the dead." }, { "n": 90, "q": "How should the Sabbath be spent?", "a": "In prayer and praise, in hearing and reading God's word, and in doing good to our fellow-men." }, { "n": 91, "q": "What is the fifth commandment?", "a": "The fifth commandment is, Honor thy father and thy mother, that thy days may be long upon the land which the Lord thy God giveth thee." }, { "n": 92, "q": "What does the fifth commandment teach us?", "a": "To love and obey our parents and teachers." }, { "n": 93, "q": "What is the sixth commandment?", "a": "The sixth commandment is, Thou shalt not kill." }, { "n": 94, "q": "What does the sixth commandment teach us?", "a": "To avoid angry passions." }, { "n": 95, "q": "What is the seventh commandment?", "a": "The seventh commandment is, Thou shalt not commit adultery." }, { "n": 96, "q": "What does the seventh commandment teach us?", "a": "To be pure in heart, language, and conduct." }, { "n": 97, "q": "What is the eighth commandment?", "a": "The eighth commandment is, Thou shalt not steal." }, { "n": 98, "q": "What does the eighth commandment teach us?", "a": "To be honest and industrious." }, { "n": 99, "q": "What is the ninth commandment?", "a": "The ninth commandment is, Thou shalt not bear false witness against thy neighbor." }, { "n": 100, "q": "What does the ninth commandment teach us?", "a": "To tell the truth." }, { "n": 101, "q": "What is the tenth commandment?", "a": "The tenth commandment is, Thou shalt not covet thy neighbor's house, thou shalt not covet thy neighbor's wife, nor his man-servant, nor his maid-servant, nor his ox, nor his ass, nor any thing that is thy neighbor's." }, { "n": 102, "q": "What does the tenth commandment teach us?", "a": "To be content with our lot." }, { "n": 103, "q": "Can any man keep these ten commandments perfectly?", "a": "No mere man, since the fall of Adam, ever did or can keep the ten commandments perfectly." }, { "n": 104, "q": "Of what use are the ten commandments to us?", "a": "They teach us our duty, and show our need of a Saviour." }, { "n": 105, "q": "What is prayer?", "a": "Prayer is asking God for things which he has promised to give." }, { "n": 106, "q": "In whose name should we pray?", "a": "Only in the name of Christ." }, { "n": 107, "q": "What has Christ given us to teach us how to pray?", "a": "The Lord's Prayer." }, { "n": 108, "q": "Repeat the Lord's Prayer.", "a": "OUR FATHER WHICH ART IN HEAVEN, HALLOWED BE THY NAME. THY KINGDOM COME. THY WILL BE DONE IN EARTH, AS IT IS IN HEAVEN. GIVE US THIS DAY OUR DAILY BREAD; AND FORGIVE US OUR DEBTS, AS WE FORGIVE OUR DEBTORS; AND LEAD US NOT INTO TEMPTATION, BUT DELIVER US FROM EVIL. FOR THINE IS THE KINGDOM, AND THE POWER, AND THE GLORY, FOR EVER. AMEN." }, { "n": 109, "q": "How many petitions are there in the Lord's Prayer?", "a": "Six." }, { "n": 110, "q": "What is the first petition?", "a": "'Hallowed be thy name.'" }, { "n": 111, "q": "What do we pray for in the first petition?", "a": "That God's name may be honored by us and all men." }, { "n": 112, "q": "What is the second petition?", "a": "'Thy kingdom come.'" }, { "n": 113, "q": "What do we pray for in the second petition?", "a": "That the gospel may be preached in all the world, and believed and obeyed by us and all men." }, { "n": 114, "q": "What is the third petition?", "a": "'Thy will be done in earth, as it is in heaven.'" }, { "n": 115, "q": "What do we pray for in the third petition?", "a": "That men on earth may serve God as the angels do in heaven." }, { "n": 116, "q": "What is the fourth petition?", "a": "'Give us this day our daily bread.'" }, { "n": 117, "q": "What do we pray for in the fourth petition?", "a": "That God would give us all things needful for our bodies and souls." }, { "n": 118, "q": "What is the fifth petition?", "a": "'And forgive us our debts, as we forgive our debtors.'" }, { "n": 119, "q": "What do we pray for in the fifth petition?", "a": "That God would pardon our sins for Christ's sake, and enable us to forgive those who have injured us." }, { "n": 120, "q": "What is the sixth petition?", "a": "'And lead us not into temptation, but deliver us from evil.'" }, { "n": 121, "q": "What do we pray for in the sixth petition?", "a": "That God would keep us from sin." }, { "n": 122, "q": "How many sacraments are there?", "a": "Two." }, { "n": 123, "q": "How many sacraments are there — what are they?", "a": "Baptism and the Lord's Supper." }, { "n": 124, "q": "Who appointed these sacraments?", "a": "The Lord Jesus Christ." }, { "n": 125, "q": "Why did Christ appoint these sacraments?", "a": "To distinguish his disciples from the world, and to comfort and strengthen them." }, { "n": 126, "q": "What sign is used in baptism?", "a": "The washing with water." }, { "n": 127, "q": "What does this signify?", "a": "That we are cleansed from sin by the blood of Christ." }, { "n": 128, "q": "In whose name are we baptized?", "a": "In the name of the Father, and of the Son, and of the Holy Ghost." }, { "n": 129, "q": "Who are to be baptized?", "a": "Believers and their children." }, { "n": 130, "q": "Why should infants be baptized?", "a": "Because they have a sinful nature and need a Saviour." }, { "n": 131, "q": "Does Christ care for little children?", "a": "Yes; for he says, SUFFER THE LITTLE CHILDREN TO COME UNTO ME, AND FORBID THEM NOT, FOR OF SUCH IS THE KINGDOM OF HEAVEN." }, { "n": 132, "q": "To what does your baptism bind you?", "a": "To be a true follower of Christ." }, { "n": 133, "q": "What is the Lord's Supper?", "a": "The eating of bread and drinking of wine in remembrance of the sufferings and death of Christ." }, { "n": 134, "q": "What does the bread represent?", "a": "The body of Christ, broken for our sins." }, { "n": 135, "q": "What does the wine represent?", "a": "The blood of Christ, shed for our salvation." }, { "n": 136, "q": "Who should partake of the Lord's Supper?", "a": "Only those who repent of their sins, believe in Christ for salvation, and love their fellow-men." }, { "n": 137, "q": "Did Christ remain in the tomb after his crucifixion?", "a": "No; he rose from the tomb on the third day after his death." }, { "n": 138, "q": "Where is Christ now?", "a": "In heaven, interceding for sinners." }, { "n": 139, "q": "Will he come again?", "a": "Yes; at the last day Christ will come to judge the world." }, { "n": 140, "q": "What becomes of men at death?", "a": "The body returns to dust, and the soul goes into the world of spirits." }, { "n": 141, "q": "Will the bodies of the dead be raised to life again?", "a": "Yes; 'the trumpet shall sound and the dead shall be raised.'" }, { "n": 142, "q": "What will become of the wicked in the day of judgment?", "a": "They shall be cast into hell." }, { "n": 143, "q": "What is hell?", "a": "A place of dreadful and endless torment." }, { "n": 144, "q": "What will become of the righteous?", "a": "They shall be taken to heaven." }, { "n": 145, "q": "What is heaven?", "a": "A glorious and happy place, where the righteous shall be for ever with the LORD." }] }, "heid": { "name": "Heidelberg Catechism", "short": "Heidelberg", "blurb": "Reformed, 1563. Long answers. Best for older kids.", "chapters": [{ "label": "Only comfort", "from": 1, "to": 2 }, { "label": "Our misery", "from": 3, "to": 11 }, { "label": "The Mediator", "from": 12, "to": 25 }, { "label": "The Apostles' Creed", "from": 26, "to": 58 }, { "label": "Justified by faith", "from": 59, "to": 64 }, { "label": "The sacraments", "from": 65, "to": 85 }, { "label": "Thankfulness", "from": 86, "to": 91 }, { "label": "The Ten Commandments", "from": 92, "to": 115 }, { "label": "The Lord's Prayer", "from": 116, "to": 129 }], "items": [{ "n": 1, "q": "What is thy only comfort in life and death?", "a": "That I with body and soul, both in life and death, am not my own, but belong unto my faithful Saviour Jesus Christ; who, with his precious blood, has fully satisfied for all my sins, and delivered me from all the power of the devil; and so preserves me that without the will of my heavenly Father, not a hair can fall from my head; yea, that all things must be subservient to my salvation, and therefore, by his Holy Spirit, He also assures me of eternal life, and makes me sincerely willing and ready, henceforth, to live unto him." }, { "n": 2, "q": "How many things are necessary for thee to know, that thou, enjoying this comfort, mayest live and die happily?", "a": "Three; the first, how great my sins and miseries are; the second, how I may be delivered from all my sins and miseries; the third, how I shall express my gratitude to God for such deliverance." }, { "n": 3, "q": "Whence knowest thou thy misery?", "a": "Out of the law of God." }, { "n": 4, "q": "What does the law of God require of us?", "a": 'Christ teaches us that briefly, Matt. 22:37-40, "Thou shalt love the Lord thy God with all thy heart, with all thy soul, and with all thy mind, and with all thy strength. This is the first and the great commandment; and the second is like unto it, Thou shalt love thy neighbour as thyself. On these two commandments hang all the law and the prophets."' }, { "n": 5, "q": "Canst thou keep all these things perfectly?", "a": "In no wise; for I am prone by nature to hate God and my neighbour." }, { "n": 6, "q": "Did God then create man so wicked and perverse?", "a": "By no means; but God created man good, and after his own image, in true righteousness and holiness, that he might rightly know God his Creator, heartily love him and live with him in eternal happiness to glorify and praise him." }, { "n": 7, "q": "Whence then proceeds this depravity of human nature?", "a": "From the fall and disobedience of our first parents, Adam and Eve, in Paradise; hence our nature is become so corrupt, that we are all conceived and born in sin." }, { "n": 8, "q": "Are we then so corrupt that we are wholly incapable of doing any good, and inclined to all wickedness?", "a": "Indeed we are; except we are regenerated by the Spirit of God." }, { "n": 9, "q": "Does not God then do injustice to man, by requiring from him in his law, that which he cannot perform?", "a": "Not at all; for God made man capable of performing it; but man, by the instigation of the devil, and his own wilful disobedience, deprived himself and all his posterity of those divine gifts." }, { "n": 10, "q": "Will God suffer such disobedience and rebellion to go unpunished?", "a": 'By no means; but is terribly displeased with our original as well as actual sins; and will punish them in his just judgment temporally and eternally, as he has declared, "Cursed is every one that continueth not in all things, which are written in the book of the law, to do them."' }, { "n": 11, "q": "Is not God then also merciful?", "a": "God is indeed merciful, but also just; therefore his justice requires, that sin which is committed against the most high majesty of God, be also punished with extreme, that is, with everlasting punishment of body and soul." }, { "n": 12, "q": "Since then, by the righteous judgment of God, we deserve temporal and eternal punishment, is there no way by which we may escape that punishment, and be again received into favour?", "a": "God will have his justice satisfied: and therefore we must make this full satisfaction, either by ourselves, or by another." }, { "n": 13, "q": "Can we ourselves then make this satisfaction?", "a": "By no means; but on the contrary we daily increase our debt." }, { "n": 14, "q": "Can there be found anywhere, one, who is a mere creature, able to satisfy for us?", "a": "None; for, first, God will not punish any other creature for the sin which man has committed; and further, no mere creature can sustain the burden of God's eternal wrath against sin, so as to deliver others from it." }, { "n": 15, "q": "What sort of a mediator and deliverer then must we seek for?", "a": "For one who is very man, and perfectly righteous; and yet more powerful than all creatures; that is, one who is also very God." }, { "n": 16, "q": "Why must he be very man, and also perfectly righteous?", "a": "Because the justice of God requires that the same human nature which has sinned, should likewise make satisfaction for sin; and one, who is himself a sinner, cannot satisfy for others." }, { "n": 17, "q": "Why must he in one person be also very God?", "a": "That he might, by the power of his Godhead sustain in his human nature, the burden of God's wrath; and might obtain for, and restore to us, righteousness and life." }, { "n": 18, "q": "Who then is that Mediator, who is in one person both very God, and a real righteous man?", "a": 'Our Lord Jesus Christ: "who of God is made unto us wisdom, and righteousness, and sanctification, and redemption."' }, { "n": 19, "q": "Whence knowest thou this?", "a": "From the holy gospel, which God himself first revealed in Paradise; and afterwards published by the patriarchs and prophets, and represented by the sacrifices and other ceremonies of the law; and lastly, has fulfilled it by his only begotten Son." }, { "n": 20, "q": "Are all men then, as they perished in Adam, saved by Christ?", "a": "No; only those who are ingrafted into him, and, receive all his benefits, by a true faith." }, { "n": 21, "q": "What is true faith?", "a": "True faith is not only a certain knowledge, whereby I hold for truth all that God has revealed to us in his word, but also an assured confidence, which the Holy Ghost works by the gospel in my heart; that not only to others, but to me also, remission of sin, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ's merits." }, { "n": 22, "q": "What is then necessary for a christian to believe?", "a": "All things promised us in the gospel, which the articles of our catholic undoubted christian faith briefly teach us." }, { "n": 23, "q": "What are these articles?", "a": "1. I believe in God the Father, Almighty, Maker of heaven and earth: 2. And in Jesus Christ, his only begotten Son, our Lord: 3. Who was conceived by the Holy Ghost, born of the Virgin Mary: 4. Suffered under Pontius Pilate; was crucified, dead, and buried: He descended into hell: 5. The third day he rose again from the dead: 6. He ascended into heaven, and sitteth at the right hand of God the Father Almighty: 7. From thence he shall come to judge the quick and the dead: 8. I believe in the Holy Ghost: 9. I believe a holy catholic church: the communion of saints: 10. The forgiveness of sins: 11. The resurrection of the body: 12. And the life everlasting." }, { "n": 24, "q": "How are these articles divided?", "a": "Into three parts; the first is of God the Father, and our creation; the second of God the Son, and our redemption; the third of God the Holy Ghost, and our sanctification." }, { "n": 25, "q": "Since there is but one only divine essence, why speakest thou of Father, Son, and Holy Ghost?", "a": "Because God has so revealed himself in his word, that these three distinct persons are the one only true and eternal God." }, { "n": 26, "q": 'What believest thou when thou sayest, "I believe in God the Father, Almighty, Maker of heaven and earth"?', "a": "That the eternal Father of our Lord Jesus Christ (who of nothing made heaven and earth, with all that is in them; who likewise upholds and governs the same by his eternal counsel and providence) is for the sake of Christ his Son, my God and my Father; on whom I rely so entirely, that I have no doubt, but he will provide me with all things necessary for soul and body and further, that he will make whatever evils he sends upon me, in this valley of tears turn out to my advantage; for he is able to do it, being Almighty God, and willing, being a faithful Father." }, { "n": 27, "q": "What dost thou mean by the providence of God?", "a": "The almighty and everywhere present power of God; whereby, as it were by his hand, he upholds and governs heaven, earth, and all creatures; so that herbs and grass, rain and drought, fruitful and barren years, meat and drink, health and sickness, riches and poverty, yea, and all things come, not by chance, but by his fatherly hand." }, { "n": 28, "q": "What advantage is it to us to know that God has created, and by his providence does still uphold all things?", "a": "That we may be patient in adversity; thankful in prosperity; and that in all things, which may hereafter befall us, we place our firm trust in our faithful God and Father, that nothing shall separate us from his love; since all creatures are so in his hand, that without his will they cannot so much as move." }, { "n": 29, "q": 'Why is the Son of God called "Jesus", that is a Saviour?', "a": "Because he saveth us, and delivereth us from our sins; and likewise, because we ought not to seek, neither can find salvation in any other." }, { "n": 30, "q": "Do such then believe in Jesus the only Saviour, who seek their salvation and welfare of saints, of themselves, or anywhere else?", "a": "They do not; for though they boast of him in words, yet in deeds they deny Jesus the only deliverer and Saviour; for one of these two things must be true, that either Jesus is not a complete Saviour; or that they, who by a true faith receive this Saviour, must find all things in him necessary to their salvation." }, { "n": 31, "q": 'Why is he called "Christ", that is anointed?', "a": "Because he is ordained of God the Father, and anointed with the Holy Ghost, to be our chief Prophet and Teacher, who has fully revealed to us the secret counsel and will of God concerning our redemption; and to be our only High Priest, who by the one sacrifice of his body, has redeemed us, and makes continual intercession with the Father for us; and also to be our eternal King, who governs us by his word and Spirit, and who defends and preserves us in that salvation, he has purchased for us." }, { "n": 32, "q": "But why art thou called a Christian?", "a": "Because I am a member of Christ by faith, and thus am partaker of his anointing; that so I may confess his name, and present myself a living sacrifice of thankfulness to him: and also that with a free and good conscience I may fight against sin and Satan in this life and afterwards I reign with him eternally, over all creatures." }, { "n": 33, "q": 'Why is Christ called the "only begotten Son" of God, since we are also the children of God?', "a": "Because Christ alone is the eternal and natural Son of God; but we are children adopted of God, by grace, for his sake." }, { "n": 34, "q": 'Wherefore callest thou him "our Lord"?', "a": "Because he hath redeemed us, both soul and body, from all our sins, not with silver or gold, but with his precious blood, and has delivered us from all the power of the devil; and thus has made us his own property." }, { "n": 35, "q": 'What is the meaning of these words "He was conceived by the Holy Ghost, born of the virgin Mary"?', "a": "That God's eternal Son, who is, and continues true and eternal God, took upon him the very nature of man, of the flesh and blood of the virgin Mary, by the operation of the Holy Ghost; that he might also be the true seed of David, like unto his brethren in all things, sin excepted." }, { "n": 36, "q": "What profit dost thou receive by Christ's holy conception and nativity?", "a": "That he is our Mediator; and with His innocence and perfect holiness, covers in the sight of God, my sins, wherein I was conceived and brought forth." }, { "n": 37, "q": 'What dost thou understand by the words, "He suffered"?', "a": "That he, all the time that he lived on earth, but especially at the end of his life, sustained in body and soul, the wrath of God against the sins of all mankind: that so by his passion, as the only propitiatory sacrifice, he might redeem our body and soul from everlasting damnation, and obtain for us the favour of God, righteousness and eternal life." }, { "n": 38, "q": 'Why did he suffer "under Pontius Pilate, as judge"?', "a": "That he, being innocent, and yet condemned by a temporal judge, might thereby free us from the severe judgement of God to which we were exposed." }, { "n": 39, "q": 'Is there anything more in his being "crucified", than if he had died some other death?', "a": "Yes there is; for thereby I am assured, that he took on him the curse which lay upon me; for the death of the cross was accursed of God." }, { "n": 40, "q": 'Why was it necessary for Christ to humble himself even "unto death"?', "a": "Because with respect to the justice and truth of God, satisfaction for our sins could be made no otherwise, than by the death of the Son of God." }, { "n": 41, "q": 'Why was he also "buried"?', "a": "Thereby to prove that he was really dead." }, { "n": 42, "q": "Since then Christ died for us, why must we also die?", "a": "Our death is not a satisfaction for our sins, but only an abolishing of sin, and a passage into eternal life." }, { "n": 43, "q": "What further benefit do we receive from the sacrifice and death of Christ on the cross?", "a": "That by virtue thereof, our old man is crucified, dead and buried with him; that so the corrupt inclinations of the flesh may no more reign in us; but that we may offer ourselves unto him a sacrifice of thanksgiving." }, { "n": 44, "q": 'Why is there added, "he descended into hell"?', "a": "That in my greatest temptations, I may be assured, and wholly comfort myself in this, that my Lord Jesus Christ, by his inexpressible anguish, pains, terrors, and hellish agonies, in which he was plunged during all his sufferings, but especially on the cross, has delivered me from the anguish and torments of hell." }, { "n": 45, "q": 'What does the "resurrection" of Christ profit us?', "a": "First, by his resurrection he has overcome death, that he might make us partakers of that righteousness which he had purchased for us by his death; secondly, we are also by his power raised up to a new life; and lastly, the resurrection of Christ is a sure pledge of our blessed resurrection." }, { "n": 46, "q": 'How dost thou understand these words, "he ascended into heaven"?', "a": "That Christ, in sight of his disciples, was taken up from earth into heaven; and that he continues there for our interest, until he comes again to judge the quick and the dead." }, { "n": 47, "q": "Is not Christ then with us even to the end of the world, as he has promised?", "a": "Christ is very man and very God; with respect to his human nature, he is no more on earth; but with respect to his Godhead, majesty, grace and spirit, he is at no time absent from us." }, { "n": 48, "q": "But if his human nature is not present, wherever his Godhead is, are not then these two natures in Christ separated from one another?", "a": "Not as all, for since the Godhead is illimitable and omnipresent, it must necessarily follow that the same is beyond the limits of the human nature he assumed, and yet is nevertheless in this human nature, and remains personally united to it." }, { "n": 49, "q": "Of what advantage to us is Christ's ascension into heaven?", "a": 'First, that he is our advocate in the presence of his Father in heaven; secondly, that we have our flesh in heaven as a sure pledge that he, as the head, will also take up to himself, us, his members; thirdly, that he sends us his Spirit as an earnest, by whose power we "seek the things which are above, where Christ sitteth on the right hand of God, and not things on earth."' }, { "n": 50, "q": 'Why is it added, "and sitteth at the right hand of God"?', "a": "Because Christ is ascended into heaven for this end, that he might appear as head of his church, by whom the Father governs all things." }, { "n": 51, "q": "What profit is this glory of Christ, our head, unto us?", "a": "First, that by his Holy Spirit he pours out heavenly graces upon us his members; and then that by his power he defends and preserves us against all enemies." }, { "n": 52, "q": 'What comfort is it to thee that "Christ shall come again to judge the quick and the dead"?', "a": "That in all my sorrows and persecutions, with uplifted head I look for the very same person, who before offered himself for my sake, to the tribunal of God, and has removed all curse from me, to come as judge from heaven: who shall cast all his and my enemies into everlasting condemnation, but shall translate me with all his chosen ones to himself, into heavenly joys and glory." }, { "n": 53, "q": "What dost thou believe concerning the Holy Ghost?", "a": "First, that he is true and coeternal God with the Father and the Son; secondly, that he is also given me, to make me by a true faith, partaker of Christ and all his benefits, that he may comfort me and abide with me for ever." }, { "n": 54, "q": 'What believest thou concerning the "holy catholic church" of Christ?', "a": "That the Son of God from the beginning to the end of the world, gathers, defends, and preserves to himself by his Spirit and word, out of the whole human race, a church chosen to everlasting life, agreeing in true faith; and that I am and forever shall remain, a living member thereof." }, { "n": 55, "q": 'What do you understand by "the communion of saints"?', "a": "First, that all and every one, who believes, being members of Christ, are in common, partakers of him, and of all his riches and gifts; secondly, that every one must know it to be his duty, readily and cheerfully to employ his gifts, for the advantage and salvation of other members." }, { "n": 56, "q": 'What believest thou concerning "the forgiveness of sins"?', "a": "That God, for the sake of Christ's satisfaction, will no more remember my sins, neither my corrupt nature, against which I have to struggle all my life long; but will graciously impute to me the righteousness of Christ, that I may never be condemned before the tribunal of God." }, { "n": 57, "q": 'What comfort does the "resurrection of the body" afford thee?', "a": "That not only my soul after this life shall be immediately taken up to Christ its head; but also, that this my body, being raised by the power of Christ, shall be reunited with my soul, and made like unto the glorious body of Christ." }, { "n": 58, "q": 'What comfort takest thou from the article of "life everlasting"?', "a": 'That since I now feel in my heart the beginning of eternal joy, after this life, I shall inherit perfect salvation, which "eye has not seen, nor ear heard, neither has it entered into the heart of man" to conceive, and that to praise God therein for ever.' }, { "n": 59, "q": "But what does it profit thee now that thou believest all this?", "a": "That I am righteous in Christ, before God, and an heir of eternal life." }, { "n": 60, "q": "How are thou righteous before God?", "a": "Only by a true faith in Jesus Christ; so that, though my conscience accuse me, that I have grossly transgressed all the commandments of God, and kept none of them, and am still inclined to all evil; notwithstanding, God, without any merit of mine, but only of mere grace, grants and imputes to me, the perfect satisfaction, righteousness and holiness of Christ; even so, as if I never had had, nor committed any sin: yea, as if I had fully accomplished all that obedience which Christ has accomplished for me; inasmuch as I embrace such benefit with a believing heart." }, { "n": 61, "q": "Why sayest thou, that thou art righteous by faith only?", "a": "Not that I am acceptable to God, on account of the worthiness of my faith; but because only the satisfaction, righteousness, and holiness of Christ, is my righteousness before God; and that I cannot receive and apply the same to myself any other way than by faith only." }, { "n": 62, "q": "But why cannot our good works be the whole, or part of our righteousness before God?", "a": "Because, that the righteousness, which can be approved of before the tribunal of God, must be absolutely perfect, and in all respects conformable to the divine law; and also, that our best works in this life are all imperfect and defiled with sin." }, { "n": 63, "q": "What! do not our good works merit, which yet God will reward in this and in a future life?", "a": "This reward is not of merit, but of grace." }, { "n": 64, "q": "But does not this doctrine make men careless and profane?", "a": "By no means: for it is impossible that those, who are implanted into Christ by a true faith, should not bring forth fruits of thankfulness." }, { "n": 65, "q": "Since then we are made partakers of Christ and all his benefits by faith only, whence does this faith proceed?", "a": "From the Holy Ghost, who works faith in our hearts by the preaching of the gospel, and confirms it by the use of the sacraments." }, { "n": 66, "q": "What are the sacraments?", "a": "The sacraments are holy visible signs and seals, appointed of God for this end, that by the use thereof, he may the more fully declare and seal to us the promise of the gospel, viz., that he grants us freely the remission of sin, and life eternal, for the sake of that one sacrifice of Christ, accomplished on the cross." }, { "n": 67, "q": "Are both word and sacraments, then, ordained and appointed for this end, that they may direct our faith to the sacrifice of Jesus Christ on the cross, as the only ground of our salvation?", "a": "Yes, indeed: for the Holy Ghost teaches us in the gospel, and assures us by the sacraments, that the whole of our salvation depends upon that one sacrifice of Christ which he offered for us on the cross." }, { "n": 68, "q": "How many sacraments has Christ instituted in the new covenant, or testament?", "a": "Two: namely, holy baptism, and the holy supper." }, { "n": 69, "q": "How art thou admonished and assured by holy baptism, that the one sacrifice of Christ upon the cross is of real advantage to thee?", "a": "Thus: That Christ appointed this external washing with water, adding thereto this promise, that I am as certainly washed by his blood and Spirit from all the pollution of my soul, that is, from all my sins, as I am washed externally with water, by which the filthiness of the body is commonly washed away." }, { "n": 70, "q": "What is it to be washed with the blood and Spirit of Christ?", "a": "It is to receive of God the remission of sins, freely, for the sake of Christ's blood, which he shed for us by his sacrifice upon the cross; and also to be renewed by the Holy Ghost, and sanctified to be members of Christ, that so we may more and more die unto sin, and lead holy and unblamable lives." }, { "n": 71, "q": "Where has Christ promised us, that he will as certainly wash us by his blood and Spirit, as we are washed with the water of baptism?", "a": 'In the institution of baptism, which is thus expressed: "Go ye, therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost", Matt.28:19. And "he that believeth, and is baptized, shall be saved; but he that believeth not, shall be damned.", Mark 16:16. This promise is also repeated, where the scripture calls baptism "the washing of regenerations" and the washing away of sins. Tit.3:5, Acts 22:16.' }, { "n": 72, "q": "Is then the external baptism with water the washing away of sin itself?", "a": "Not at all: for the blood of Jesus Christ only, and the Holy Ghost cleanse us from all sin." }, { "n": 73, "q": 'Why then does the Holy Ghost call baptism "the washing of regeneration," and "the washing away of sins"?', "a": "God speaks thus not without great cause, to-wit, not only thereby to teach us, that as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that by this divine pledge and sign he may assure us, that we are spiritually cleansed from our sins as really, as we are externally washed with water." }, { "n": 74, "q": "Are infants also to be baptized?", "a": "Yes: for since they, as well as the adult, are included in the covenant and church of God; and since redemption from sin by the blood of Christ, and the Holy Ghost, the author of faith, is promised to them no less than to the adult; they must therefore by baptism, as a sign of the covenant, be also admitted into the christian church; and be distinguished from the children of unbelievers as was done in the old covenant or testament by circumcision, instead of which baptism is instituted in the new covenant." }, { "n": 75, "q": "How art thou admonished and assured in the Lord's Supper, that thou art a partaker of that one sacrifice of Christ, accomplished on the cross, and of all his benefits?", "a": "Thus: That Christ has commanded me and all believers, to eat of this broken bread, and to drink of this cup, in remembrance of him, adding these promises: first, that his body was offered and broken on the cross for me, and his blood shed for me, as certainly as I see with my eyes, the bread of the Lord broken for me, and the cup communicated to me; and further, that he feeds and nourishes my soul to everlasting life, with his crucified body and shed blood, as assuredly as I receive from the hands of the minister, and taste with my mouth the bread and cup of the Lord, as certain signs of the body and blood of Christ." }, { "n": 76, "q": "What is it then to eat the crucified body, and drink the shed blood of Christ?", "a": 'It is not only to embrace with believing heart all the sufferings and death of Christ and thereby to obtain the pardon of sin, and life eternal; but also, besides that, to become more and more united to his sacred body, by the Holy Ghost, who dwells both in Christ and in us; so that we, though Christ is in heaven and we on earth, are notwithstanding "flesh of his flesh and bone of his bone" and that we live, and are governed forever by one spirit, as members of the same body are by one soul.' }, { "n": 77, "q": "Where has Christ promised that he will as certainly feed and nourish believers with his body and bleed, as they eat of this broken bread, and drink of this cup?", "a": 'In the institution of the supper, which is thus expressed: "The Lord Jesus, the same night in which he was betrayed, took bread, and when he had given thanks, he brake it, and: said: eat, this is my body, which is broken for you; this do in remembrance of me. After the same manner also he took the cup, when he had supped, saying: this cup is the new testament in my blood; this do ye, as often as ye drink it, in remembrance of me. For, as often as ye eat this bread, and drink this cup, ye do show the Lord\'s death till he come." 1 Cor.11:23-26. This promise is repeated by the holy apostle Paul, where he says "The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ? For we being many are one bread, and one body: for we are all par
